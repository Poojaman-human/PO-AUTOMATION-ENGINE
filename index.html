/* Plain CSV of the same Sheet1 columns, used when the Excel library is blocked.
   Values instead of formulas, but the buyer is not stuck waiting on IT. */
function downloadCSVFallback(){
  var R=ENG.result;if(!R){toast('Process a sheet first',true);return;}
  var hasQty=R.hasQty;
  var head=R.headers.slice().concat(['CONCAT','COUNT','OPTIONS','RRP EX-VAT ('+ENG.cur+')','COST EX-VAT ('+ENG.cur+')']);
  if(hasQty)head.push('TOTAL VALUE ('+ENG.cur+')');
  var others=['UAE','KSA','KWT','QAT'].filter(function(t){return t!==ENG.terr;});
  if(ENG.dummyRRP!==false)for(var d=0;d<others.length;d++)head.push('DUMMY RRP '+others[d]);
  if(R.hasBarcode){head.push('TYPE');head.push('PID SOURCE');}
  var lines=[head];
  var cl=R.outRows.map(function(r){return r.concat;});
  for(var i=0;i<R.outRows.length;i++){
    var rw=R.outRows[i];var cnt=0;
    for(var c=0;c<cl.length;c++)if(cl[c]===rw.concat)cnt++;
    var row=rw.orig.slice();
    row.push(rw.concat,cnt,rw.opt,rw.rrpEx.toFixed(2),rw.costEx.toFixed(2));
    if(hasQty)row.push(rw.totalVal!=null?rw.totalVal.toFixed(2):'');
    if(ENG.dummyRRP!==false)for(var o=0;o<others.length;o++){
      var t=others[o];var base=rw.rrpEx*(R.cfg.vat||1);  /* back to inc-VAT original */
      var rl=DUMMY_RULES[t]||{expr:'',dp:2};
      var v=t==='KSA'?base/1.05*1.15:t==='KWT'?base*0.084:base;
      var f=Math.pow(10,rl.dp);
      row.push((Math.round(v*f)/f).toFixed(rl.dp));}
    if(R.hasBarcode){row.push(rw.itemType||'');row.push(rw.pidSource||'');}
    lines.push(row);}
  var csv=lines.map(function(r){return r.map(function(v){
    var x=String(v==null?'':v);
    return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}).join('\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='PO_'+ENG.type+'_'+ENG.terr+'_'+String(ENG.vname||'vendor').replace(/\s+/g,'_')+'.csv';
  a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1200);
  logA('Downloaded CSV fallback','Engine',ENG.vname||'');}

/* ===== DROP RULES =====
   Applied ONLY to rows the PID barcode check tagged as New. Replenishment lines
   are already selling, so they pass through untouched whatever their size count
   or age group. Rows with an Unknown tag (no barcode column, or no PID dump
   loaded) are also left alone - we do not drop on missing evidence.

   Rule 1: fewer than DROP_MIN_COUNT sizes in an option. A style-colour offered
           in one or two sizes is not worth listing.
   Rule 2: kids clothing, identified from the clothing-id / category column. */
var DROP_MIN_COUNT=3;
var KIDS_RE=/(^|[^a-z])(kid|kids|kidswear|child|children|childrens|boy|boys|girl|girls|infant|infants|toddler|junior|juniors|baby|babies|newborn|new born)([^a-z]|$)/i;
/* Categories the kids rule DOES apply to - clothing in its various forms. */
var CLOTHING_RE=/(clothing|apparel|garment|wear|modest|abaya|jalabiya|kaftan|innerwear|inner wear|lingerie|nightwear|sleepwear|hosiery|denim|top|bottom|dress|shirt|trouser|jacket|outerwear)/i;
/* Categories the kids rule must NOT apply to, even when the line says kids.
   Checked after CLOTHING_RE and wins over it, because a value like
   "Kids Footwear" contains "wear" and would otherwise look like clothing. */
var NON_CLOTHING_RE=/(footwear|shoe|sandal|slipper|sneaker|trainer|boot|accessor|bag|backpack|watch|jewel|eyewear|sunglass|belt|cap|hat|scarf|sock|fragrance|beauty|cosmetic|toy|equipment|luggage)/i;
var KIDS_COL_HINTS=['clothing id','clothingid','clothing','age group','agegroup','category','class','division','department','dept','gender','segment','sub department','subdepartment','group','product type','producttype','merch'];

/* Every column that might carry a category signal, not just the first match -
   a sheet often splits it across "Department" and "Category". */
function findCategoryCols(headers){
  var h=headers.map(function(x){return String(x||'').toLowerCase().trim();});
  var out=[];
  for(var c=0;c<h.length;c++){
    for(var i=0;i<KIDS_COL_HINTS.length;i++){
      if(h[c].indexOf(KIDS_COL_HINTS[i])>=0){out.push(c);break;}}}
  return out;}
function findKidsCol(headers){var c=findCategoryCols(headers);return c.length?c[0]:-1;}

/* Shared by the on-screen preview and the workbook build, so what the buyer is
   shown before downloading is exactly what the file contains. */
function computeDrops(R){
  var counts={},i,j;
  for(i=0;i<R.outRows.length;i++){
    var k=R.outRows[i].concat;
    counts[k]=(counts[k]||0)+1;}
  var catCols=findCategoryCols(R.headers);
  var deptTxt=String(ENG.dept||'');
  var kept=[],dropped=[],lowCount=0,kidsCount=0,kidsFootwearKept=0,ambiguous=0;
  for(i=0;i<R.outRows.length;i++){
    var rw=R.outRows[i];
    var cnt=counts[rw.concat]||0;
    rw._count=cnt;
    var reasons=[];
    if(rw.itemType==='New'){
      if(cnt<DROP_MIN_COUNT)reasons.push('Only '+cnt+' size'+(cnt!==1?'s':'')+' in this option (minimum '+DROP_MIN_COUNT+')');
      /* build one text blob from every category-ish column plus the Step 1 department */
      var parts=[];
      for(j=0;j<catCols.length;j++){
        var v=rw.orig[catCols[j]];
        if(v!=null&&String(v).trim())parts.push(String(v));}
      var rowTxt=parts.join(' ');
      /* Kids can be flagged by the row OR by the PO's department. */
      var isKids=KIDS_RE.test(rowTxt)||KIDS_RE.test(deptTxt);
      if(isKids){
        /* Decide clothing-vs-not from the ROW's own category first. The Step 1
           department is only a fallback - otherwise a PO marked "Footwear"
           would rescue a row whose own category clearly says "Kids Clothing",
           and vice versa. Row-level data always wins. */
        var src='',verdict='';
        if(NON_CLOTHING_RE.test(rowTxt)){verdict='keep';src=rowTxt;}
        else if(CLOTHING_RE.test(rowTxt)){verdict='drop';src=rowTxt;}
        else if(NON_CLOTHING_RE.test(deptTxt)){verdict='keep';src='department: '+deptTxt;}
        else if(CLOTHING_RE.test(deptTxt)){verdict='drop';src='department: '+deptTxt;}
        else{verdict='unclear';src=rowTxt||deptTxt;}
        if(verdict==='drop')reasons.push('Kids clothing ('+src+')');
        else if(verdict==='keep'){
          kidsFootwearKept++;
          rw._kidsNote='Kids but not clothing ('+src+') - kept';
        }else{
          ambiguous++;
          rw._kidsNote='Kids but category unclear ('+src+') - kept';}}}
    rw._reasons=reasons;
    if(reasons.length){
      dropped.push(rw);
      if(reasons.join(' ').indexOf('size')>=0)lowCount++;
      if(reasons.join(' ').indexOf('Kids')>=0)kidsCount++;
    }else kept.push(rw);}
  return {kept:kept,dropped:dropped,counts:counts,
    catCols:catCols,
    kidsCol:catCols.length?catCols[0]:-1,
    kidsColName:catCols.map(function(c){return R.headers[c];}).join(', '),
    deptIsKids:KIDS_RE.test(deptTxt),
    lowCount:lowCount,kidsCount:kidsCount,
    kidsFootwearKept:kidsFootwearKept,ambiguous:ambiguous};}

function downloadExcel(){
  var R=ENG.result;
  if(!R){toast('Process a vendor sheet first',true);return;}
  if(!xlsxReady()){
    toast('Excel library blocked by your network \u2014 downloading CSV instead',true);
    downloadCSVFallback();return;}
  var D=computeDrops(R);
  buildWorkbookFromCtx({
    headers:R.headers,data:R.data,kept:D.kept,dropped:D.dropped,
    cfg:R.cfg,hasQty:R.hasQty,hasBarcode:R.hasBarcode,
    cur:ENG.cur,margin:ENG.margin,terr:ENG.terr,type:ENG.type,vname:ENG.vname,dept:ENG.dept,
    dummyRRP:ENG.dummyRRP!==false,
    createdDate:new Date().toISOString().slice(0,10),
    nextRow:(gtOn()&&GTSTATE.nextRow)?GTSTATE.nextRow:null},null);
  logA('Downloaded Excel','Engine',ENG.vname+' | kept '+D.kept.length+', dropped '+D.dropped.length);}

/* Context-driven workbook build. Used by the buyer straight after processing and
   by Planning / Operations from the snapshot stored on the PO, so every role
   downloads a byte-identical file. */
function buildWorkbookFromCtx(CTX,poNumber){
  var wb=XLSX.utils.book_new();
  var hasQty=CTX.hasQty;var cfg=CTX.cfg;
  var origH=CTX.headers;var origLen=origH.length;
  var keptRows=CTX.kept;
  var D={kept:CTX.kept,dropped:CTX.dropped};
  var ENGX={cur:CTX.cur,margin:CTX.margin,terr:CTX.terr,type:CTX.type,vname:CTX.vname,dummyRRP:CTX.dummyRRP};

  function colL(c){var s='';c++;while(c>0){c--;s=String.fromCharCode(65+(c%26))+s;c=Math.floor(c/26);}return s;}
  var HDR_STYLE={font:{bold:true,color:{rgb:'FFFFFF'},sz:11},fill:{fgColor:{rgb:'1F3864'}},alignment:{horizontal:'center'}};
  var DROP_HDR_STYLE={font:{bold:true,color:{rgb:'FFFFFF'},sz:11},fill:{fgColor:{rgb:'C0504D'}},alignment:{horizontal:'center'}};
  var ORIG_HDR_STYLE={font:{bold:true,color:{rgb:'FFFFFF'},sz:11},fill:{fgColor:{rgb:'7F7F7F'}},alignment:{horizontal:'center'}};
  var CALC_STYLE={fill:{fgColor:{rgb:'DDEEFF'}}};
  var TERR_STYLE={fill:{fgColor:{rgb:'E2EFDA'}}};
  var DROP_CELL={fill:{fgColor:{rgb:'FCE4E4'}}};

  function setCell(ws,r,c,val,isFormula,style){
    var addr=colL(c)+(r+1);var cell;
    if(isFormula){cell={t:'n',f:val,v:0};}
    else if(typeof val==='number'){cell={t:'n',v:val};}
    else{cell={t:'s',v:String(val!=null?val:'')};}
    if(style){
      if(style.numFmt){cell.z=style.numFmt;
        var s2={};for(var k in style)if(k!=='numFmt')s2[k]=style[k];
        if(Object.keys(s2).length)cell.s=s2;}
      else cell.s=style;}
    if(!ws['!ref'])ws['!ref']='A1';ws[addr]=cell;}
  function expandRange(ws,maxR,maxC){ws['!ref']='A1:'+colL(maxC)+(maxR+1);}

  /* identifier columns stay text so barcodes survive byte for byte */
  var TEXT_COL={};
  for(var tc=0;tc<origH.length;tc++){
    var th=String(origH[tc]||'').toLowerCase();
    if(th.indexOf('barcode')>=0||th.indexOf('ean')>=0||th.indexOf('upc')>=0||
       th.indexOf('sku')>=0||th.indexOf('style')>=0||th.indexOf('article')>=0||
       th.indexOf('item code')>=0||th.indexOf('material')>=0)TEXT_COL[tc]=1;}
  function looksLikeId(v){
    var t=String(v==null?'':v).trim();
    if(!t)return false;
    if(!/^[0-9]+$/.test(t))return false;
    return t.length>=12||/^0/.test(t);}
  function writeOrigCell(ws,wsRow,oi,ov,style){
    if(TEXT_COL[oi]||looksLikeId(ov)){
      var st={numFmt:'@'};if(style&&style.fill)st.fill=style.fill;
      setCell(ws,wsRow,oi,String(ov==null?'':ov),false,st);return;}
    var nv=parseFloat(ov);
    setCell(ws,wsRow,oi,(!isNaN(nv)&&ov!==''&&String(nv)===String(ov).trim())?nv:ov,false,style||null);}

  /* ================= SHEET 1: Original (verbatim) ================= */
  var wsO={};
  for(var oh=0;oh<origH.length;oh++)setCell(wsO,0,oh,origH[oh],false,ORIG_HDR_STYLE);
  for(var orr=0;orr<CTX.data.length;orr++){
    var srcRow=CTX.data[orr];
    for(var oc=0;oc<origLen;oc++)writeOrigCell(wsO,orr+1,oc,oc<srcRow.length?srcRow[oc]:'',null);}
  expandRange(wsO,CTX.data.length,origLen-1);
  var oW=[];for(var ow=0;ow<origLen;ow++)oW.push({wch:Math.max(String(origH[ow]||'').length+2,14)});
  wsO['!cols']=oW;
  XLSX.utils.book_append_sheet(wb,wsO,'Original');

  /* ================= SHEET 2: PO Sheet ================= */
  var rrpSrcCol=-1;
  for(var h=0;h<origH.length;h++){var hl=origH[h].toLowerCase();if(hl.indexOf('rrp')>=0||hl.indexOf('msrp')>=0||hl.indexOf('srp')>=0){rrpSrcCol=h;break;}}
  var qtySrcCol=-1;
  if(hasQty){for(var hq=0;hq<origH.length;hq++){var hql=origH[hq].toLowerCase();if(hql.indexOf('qty')>=0||hql.indexOf('quantity')>=0){qtySrcCol=hq;break;}}}
  var styleSrcCol=-1,colorSrcCol=-1;
  for(var hs=0;hs<origH.length;hs++){var hsl=origH[hs].toLowerCase();
    if(styleSrcCol<0&&(hsl.indexOf('style')>=0||hsl==='sku'))styleSrcCol=hs;
    if(colorSrcCol<0&&(hsl.indexOf('colour')>=0||hsl.indexOf('color')>=0))colorSrcCol=hs;}
  var vatDiv=cfg.vat!==1?'/'+cfg.vat:'';
  var marginMult=(100-ENGX.margin)/100;
  var lastDataRow=keptRows.length+1;

  var extraCols=[];
  var cConcat=origLen+extraCols.length;extraCols.push('CONCAT');
  var cCount=origLen+extraCols.length;extraCols.push('COUNT');
  var cOpts=origLen+extraCols.length;extraCols.push('OPTIONS');
  var cRrpEx=origLen+extraCols.length;extraCols.push('RRP EX-VAT ('+ENGX.cur+')');
  var cCostEx=origLen+extraCols.length;extraCols.push('COST EX-VAT ('+ENGX.cur+')');
  var cMargin=origLen+extraCols.length;extraCols.push('MARGIN %');
  var cTotalVal=-1;
  if(hasQty){cTotalVal=origLen+extraCols.length;extraCols.push('TOTAL VALUE ('+ENGX.cur+')');}
  var dummyTerrs=[],terrColIdx={};
  var allTerrs=['UAE','KSA','KWT','QAT'];
  if(ENGX.dummyRRP!==false){
    for(var ti=0;ti<allTerrs.length;ti++){
      if(allTerrs[ti]!==ENGX.terr){dummyTerrs.push(allTerrs[ti]);
        terrColIdx[allTerrs[ti]]=origLen+extraCols.length;extraCols.push('DUMMY RRP '+allTerrs[ti]);}}}
  var cType=-1,cPidSrc=-1;
  if(CTX.hasBarcode){cType=origLen+extraCols.length;extraCols.push('TYPE');cPidSrc=origLen+extraCols.length;extraCols.push('PID SOURCE');}

  var hdr=origH.slice().concat(extraCols);
  var totalCols=hdr.length;
  var ws={};
  for(var hi=0;hi<hdr.length;hi++)setCell(ws,0,hi,hdr[hi],false,HDR_STYLE);

  for(var ri=0;ri<keptRows.length;ri++){
    var rw=keptRows[ri];var exRow=ri+2;var wsRow=ri+1;
    for(var oi=0;oi<origLen;oi++)writeOrigCell(ws,wsRow,oi,oi<rw.orig.length?rw.orig[oi]:'',null);
    if(styleSrcCol>=0&&colorSrcCol>=0)setCell(ws,wsRow,cConcat,colL(styleSrcCol)+exRow+'&'+colL(colorSrcCol)+exRow,true,CALC_STYLE);
    else setCell(ws,wsRow,cConcat,rw.concat,false,CALC_STYLE);
    setCell(ws,wsRow,cCount,'COUNTIF('+colL(cConcat)+'$2:'+colL(cConcat)+'$'+lastDataRow+','+colL(cConcat)+exRow+')',true,CALC_STYLE);
    setCell(ws,wsRow,cOpts,'IF(COUNTIF('+colL(cConcat)+'$2:'+colL(cConcat)+exRow+','+colL(cConcat)+exRow+')=1,1,0)',true,CALC_STYLE);
    if(rrpSrcCol>=0)setCell(ws,wsRow,cRrpEx,colL(rrpSrcCol)+exRow+(vatDiv||''),true,CALC_STYLE);
    else setCell(ws,wsRow,cRrpEx,rw.rrpEx,false,CALC_STYLE);
    setCell(ws,wsRow,cCostEx,colL(cRrpEx)+exRow+'*'+marginMult,true,CALC_STYLE);
    /* margin shown per line, derived from the two columns beside it rather than
       hardcoded, so if someone edits a cost the margin follows */
    setCell(ws,wsRow,cMargin,'IF('+colL(cRrpEx)+exRow+'=0,"",ROUND((1-'+colL(cCostEx)+exRow+'/'+colL(cRrpEx)+exRow+')*100,1))',true,
      {fill:CALC_STYLE.fill,numFmt:'0.0'});
    if(hasQty){
      if(qtySrcCol>=0)setCell(ws,wsRow,cTotalVal,colL(cCostEx)+exRow+'*'+colL(qtySrcCol)+exRow,true,CALC_STYLE);
      else setCell(ws,wsRow,cTotalVal,rw.totalVal||0,false,CALC_STYLE);}
    var rrpRef=(rrpSrcCol>=0?colL(rrpSrcCol):colL(cRrpEx))+exRow;
    for(var di=0;di<dummyTerrs.length;di++){var dt=dummyTerrs[di];var dtCol=terrColIdx[dt];
      var rule=DUMMY_RULES[dt];
      if(!rule){setCell(ws,wsRow,dtCol,0,false,TERR_STYLE);continue;}
      setCell(ws,wsRow,dtCol,'ROUND('+rrpRef+rule.expr+','+rule.dp+')',true,
        {fill:TERR_STYLE.fill,numFmt:(rule.dp===0?'0':'0.00')});}
    if(CTX.hasBarcode){setCell(ws,wsRow,cType,rw.itemType||'',false,null);setCell(ws,wsRow,cPidSrc,rw.pidSource||'',false,null);}}

  expandRange(ws,keptRows.length,totalCols-1);
  var colWidths=[];for(var wi=0;wi<totalCols;wi++)colWidths.push({wch:Math.max(String(hdr[wi]||'').length+2,14)});
  ws['!cols']=colWidths;
  XLSX.utils.book_append_sheet(wb,ws,'PO Sheet');

  /* ================= SHEET 3: Summary ================= */
  var PO="'PO Sheet'!";
  var ws2={};
  var SUM_LABEL_STYLE={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1F3864'}}};
  var SUM_VAL_STYLE={fill:{fgColor:{rgb:'E2EFDA'}}};
  var sumLabels=['Region','Options','Quantity','Total Value','APP Import Currency','APP','PO Creation Entity','Delivery Country','Vendor Name','Delivery WH Location','Item Classification','ROW No','PO Request Date','Currency','Territory','Rows in PO Sheet','Rows Dropped','Rows in Original'];
  for(var si=0;si<sumLabels.length;si++)setCell(ws2,si,0,sumLabels[si],false,SUM_LABEL_STYLE);
  setCell(ws2,0,1,ENGX.terr+' - '+ENGX.type.toUpperCase(),false,SUM_VAL_STYLE);
  if(keptRows.length)setCell(ws2,1,1,'SUMPRODUCT(('+PO+colL(cOpts)+'2:'+colL(cOpts)+lastDataRow+'>0)*1)',true,SUM_VAL_STYLE);
  else setCell(ws2,1,1,0,false,SUM_VAL_STYLE);
  if(hasQty&&qtySrcCol>=0&&keptRows.length)setCell(ws2,2,1,'SUM('+PO+colL(qtySrcCol)+'2:'+colL(qtySrcCol)+lastDataRow+')',true,SUM_VAL_STYLE);
  else setCell(ws2,2,1,hasQty?0:'',false,SUM_VAL_STYLE);
  if(hasQty&&cTotalVal>=0&&keptRows.length)setCell(ws2,3,1,'SUM('+PO+colL(cTotalVal)+'2:'+colL(cTotalVal)+lastDataRow+')',true,SUM_VAL_STYLE);
  else setCell(ws2,3,1,'',false,SUM_VAL_STYLE);
  setCell(ws2,4,1,ENGX.cur,false,SUM_VAL_STYLE);
  if(hasQty)setCell(ws2,5,1,'IF(B3=0,"",B4/B3)',true,SUM_VAL_STYLE);else setCell(ws2,5,1,'',false,SUM_VAL_STYLE);
  setCell(ws2,6,1,cfg.entity,false,SUM_VAL_STYLE);setCell(ws2,7,1,ENGX.terr,false,SUM_VAL_STYLE);
  setCell(ws2,8,1,ENGX.vname,false,SUM_VAL_STYLE);setCell(ws2,9,1,ENGX.terr,false,SUM_VAL_STYLE);
  for(var sv2=10;sv2<14;sv2++)setCell(ws2,sv2,1,'',false,SUM_VAL_STYLE);
  /* ROW No is the row this PO occupies in the GO LIVE 2 sheet. For a PO already
     written it is the allocated row; for a download taken before the PO is
     raised it is the row it WILL take, marked as pending so nobody reads a
     provisional number as final. */
  if(CTX.trackerRow)setCell(ws2,11,1,CTX.trackerRow,false,SUM_VAL_STYLE);
  else if(CTX.nextRow)setCell(ws2,11,1,String(CTX.nextRow)+' (next free row)',false,SUM_VAL_STYLE);
  setCell(ws2,12,1,CTX.createdDate||'',false,SUM_VAL_STYLE);
  setCell(ws2,13,1,ENGX.cur,false,SUM_VAL_STYLE);
  setCell(ws2,14,1,ENGX.terr,false,SUM_VAL_STYLE);
  setCell(ws2,15,1,keptRows.length,false,SUM_VAL_STYLE);
  setCell(ws2,16,1,D.dropped.length,false,SUM_VAL_STYLE);
  setCell(ws2,17,1,(CTX.kept.length+CTX.dropped.length),false,SUM_VAL_STYLE);
  expandRange(ws2,sumLabels.length-1,1);
  ws2['!cols']=[{wch:24},{wch:32}];
  XLSX.utils.book_append_sheet(wb,ws2,'Summary');

  /* ================= SHEET 4: Dropped ================= */
  var ws3={};
  var dHdr=origH.slice().concat(['SIZE COUNT','TYPE','PID SOURCE','DROP REASON']);
  for(var dh=0;dh<dHdr.length;dh++)setCell(ws3,0,dh,dHdr[dh],false,DROP_HDR_STYLE);
  if(D.dropped.length){
    for(var dr=0;dr<D.dropped.length;dr++){
      var drw=D.dropped[dr];var dRow=dr+1;
      for(var dc=0;dc<origLen;dc++)writeOrigCell(ws3,dRow,dc,dc<drw.orig.length?drw.orig[dc]:'',null);
      setCell(ws3,dRow,origLen,drw._count,false,DROP_CELL);
      setCell(ws3,dRow,origLen+1,drw.itemType||'',false,DROP_CELL);
      setCell(ws3,dRow,origLen+2,drw.pidSource||'',false,DROP_CELL);
      setCell(ws3,dRow,origLen+3,drw._reasons.join('; '),false,DROP_CELL);}
    expandRange(ws3,D.dropped.length,dHdr.length-1);
  }else{
    setCell(ws3,1,0,'Nothing dropped - every New line met the minimum size count and none were kids clothing.',false,null);
    expandRange(ws3,1,dHdr.length-1);}
  var dW=[];for(var dwi=0;dwi<dHdr.length;dwi++)dW.push({wch:Math.max(String(dHdr[dwi]||'').length+2,14)});
  dW[dHdr.length-1]={wch:46};
  ws3['!cols']=dW;
  XLSX.utils.book_append_sheet(wb,ws3,'Dropped');

  /* ===== Download ===== */
  var wbout=XLSX.write(wb,{bookType:'xlsx',type:'binary',cellFormula:true});
  function s2ab(s){var buf=new ArrayBuffer(s.length);var view=new Uint8Array(buf);for(var i=0;i<s.length;i++)view[i]=s.charCodeAt(i)&0xFF;return buf;}
  var blob=new Blob([s2ab(wbout)],{type:'application/octet-stream'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(poNumber?String(poNumber):'PO_'+ENGX.type+'_'+ENGX.terr+'_'+String(ENGX.vname||'vendor').replace(/\s+/g,'_'))+'.xlsx';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('Excel downloaded \u2014 '+keptRows.length+' rows in PO Sheet, '+D.dropped.length+' dropped');}

/* Any unexpected failure inside the Excel build should tell the user and still
   give them their data, rather than a button that appears to do nothing. */
var _dlExcelInner=downloadExcel;
downloadExcel=function(){
  try{_dlExcelInner();}
  catch(e){
    toast('Excel build failed: '+(e&&e.message?e.message:'unknown')+' \u2014 downloading CSV instead',true);
    try{downloadCSVFallback();}catch(e2){toast('CSV fallback also failed: '+e2.message,true);}}};
window.downloadExcel=downloadExcel;

function pad2(n){return n<10?'0'+n:''+n;}
function genTrackingId(type,brand,territory){
  var d=new Date();var ds=String(d.getFullYear()).slice(2)+pad2(d.getMonth()+1)+pad2(d.getDate());
  var modeCode=type==='Marketplace'?'MP':'CON';
  var brandCode=(brand||'GEN').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)||'GEN';
  var terrCode=(territory||'XX').toUpperCase();
  var prefix=modeCode+'-'+ds+'-'+brandCode+'-'+terrCode;
  var seq=1;
  for(var i=0;i<DB.pos.length;i++){if(DB.pos[i].trackingId&&DB.pos[i].trackingId.indexOf(prefix+'-')===0)seq++;}
  return prefix+'-'+pad2(seq);}
function createPOFromEngine(){
  var R=ENG.result;
  var terrPricing=null;
  if(ENG.type==='Consignment'){
    var terrs=R.isMultiTerr?R.terrDetected:(R.replicateOn?TERR_LIST:[R.sourceTerr||ENG.terr]);
    var avg={};
    for(var ti=0;ti<terrs.length;ti++){var t=terrs[ti];var sum=0,cnt=0;
      for(var ri=0;ri<R.outRows.length;ri++){var val=R.outRows[ri].terrRRP[t];if(val!=null){sum+=val;cnt++;}}
      avg[t]=cnt?+(sum/cnt).toFixed(2):null;}
    terrPricing={sourceTerr:R.sourceTerr||ENG.terr,mode:R.isMultiTerr?'uploaded-multi':(R.replicateOn?'replicated':'single'),avg:avg};}
  var singleId=genTrackingId(ENG.type,ENG.brand,ENG.terr);
  var po={id:uid('po'),trackingId:singleId,
    type:ENG.type,poNumber:singleId,supplier:ENG.vname,vendorId:ENG.vendorId,
    territory:ENG.terr,brand:ENG.brand,department:ENG.dept||'',buyer:ENG.buyer||'',
    currency:ENG.cur,value:R.totalValue||0,margin:ENG.margin,priority:ENG.prio||'Medium',
    entity:(TCFG[ENG.terr]||{}).entity||'',stage:'PO Request',stageIdx:0,approval:'Pending',
    qc:{log:[],owner:'',status:'Pending',approval:'',comments:'',dropReason:'',dropOther:'',delayed:'',delayReason:'',delayOther:'',delayNote:'',delayImages:[],lastUpdated:''},
    itemCreation:{comments:[],status:''},extra:{},createdDate:new Date().toISOString().slice(0,10),
    pidBreakdown:R.hasBarcode?{newCount:R.newC,replCount:R.replC,unkCount:R.unkC}:null,
    totalOptions:R.totalOpts,totalQty:R.hasQty?R.totalQty:0,app:R.app||0,terrPricing:terrPricing,
    sheet:buildSheetSnapshot(R)};
  DB.pos.unshift(po);sv();logA('Created PO','Engine',po.trackingId);
  /* Put the row in the shared tracker straight away - before Planning approval -
     so the team can start filling V..BI while the approval is still pending.
     Silent: a bridge outage must not block raising a PO, and it can be re-synced
     from the tracker page. */
  if(gtOn())gtPushPO(po,true).then(function(r){
    if(r&&r.row)toast('Added to Google tracker at row '+r.row);});
  notifyEvent('created','New PO raised \u00b7 '+po.poNumber,
    'A new PO request has been raised and is awaiting Planning approval.\n\n'+poLine(po),po);
  sendNotification('planning','New PO Request &middot; '+po.poNumber,
    'A new PO request has been submitted and is awaiting Planning approval.\n\nPO Number: '+po.poNumber+'\nSupplier: '+po.supplier+'\nBrand: '+po.brand+'\nType: '+po.type+'\nTerritory: '+po.territory+'\nValue: '+po.currency+' '+(po.value||0).toLocaleString());
  ENG.step=1;ENG.result=null;toast('PO created: '+po.trackingId);
  setTimeout(function(){go(ENG.type==='Marketplace'?'marketplace':'consignment');},600);}

/* ===== PO SHEET SNAPSHOT =====
   Planning and Operations need to review the same sheet the buyer processed, so
   the processed rows are stored on the PO record itself rather than left in the
   buyer's browser memory. Everything downstream - the in-dashboard viewer, the
   checks panel, and the Excel download from any role - reads from this snapshot,
   which means all three roles are always looking at identical numbers.

   Rows are capped: the whole dataset syncs as one JSON blob, and an uncapped
   4,000-line sheet per PO would blow the storage budget. Beyond the cap the
   aggregates stay exact and the viewer says it is showing a subset. */
var SHEET_ROW_CAP=1200;

function buildSheetSnapshot(R){
  var D=computeDrops(R);
  function packRow(rw){
    return {o:rw.orig,c:rw.concat,n:rw._count||0,
      re:+(rw.rrpEx||0).toFixed(4),ce:+(rw.costEx||0).toFixed(4),
      q:rw.qty==null?null:rw.qty,tv:rw.totalVal==null?null:+(rw.totalVal||0).toFixed(2),
      t:rw.itemType||'',ps:rw.pidSource||'',bc:rw.barcode||'',
      rs:(rw._reasons&&rw._reasons.length)?rw._reasons:null,
      kn:rw._kidsNote||null};}
  var keptOut=[],dropOut=[],i;
  for(i=0;i<D.kept.length&&i<SHEET_ROW_CAP;i++)keptOut.push(packRow(D.kept[i]));
  for(i=0;i<D.dropped.length&&i<SHEET_ROW_CAP;i++)dropOut.push(packRow(D.dropped[i]));
  var origOut=[];
  for(i=0;i<R.data.length&&i<SHEET_ROW_CAP;i++)origOut.push(R.data[i]);
  return {
    headers:R.headers.slice(),
    original:origOut,
    kept:keptOut,
    dropped:dropOut,
    counts:{kept:D.kept.length,dropped:D.dropped.length,original:R.data.length,
      lowCount:D.lowCount,kids:D.kidsCount,kidsKept:D.kidsFootwearKept,ambiguous:D.ambiguous},
    catCols:D.kidsColName||'',
    truncated:(D.kept.length>SHEET_ROW_CAP||D.dropped.length>SHEET_ROW_CAP||R.data.length>SHEET_ROW_CAP),
    cfg:{vat:R.cfg.vat,entity:R.cfg.entity},
    hasQty:!!R.hasQty,hasBarcode:!!R.hasBarcode,
    dummyRRP:ENG.dummyRRP!==false,
    cur:ENG.cur,margin:ENG.margin,terr:ENG.terr,type:ENG.type,
    vname:ENG.vname,dept:ENG.dept||'',
    totals:{options:R.totalOpts,qty:R.hasQty?R.totalQty:0,value:R.totalValue||0,app:R.app||0,
      newC:R.newC||0,replC:R.replC||0,unkC:R.unkC||0}};}

/* Rebuild the shape downloadExcel expects from a stored snapshot, so any role
   can regenerate the identical workbook without the engine being loaded. */
function ctxFromSnapshot(sn){
  function unpack(r){
    return {orig:r.o,concat:r.c,_count:r.n,rrpEx:r.re,costEx:r.ce,qty:r.q,totalVal:r.tv,
      itemType:r.t,pidSource:r.ps,barcode:r.bc,_reasons:r.rs||[],_kidsNote:r.kn||'',
      opt:0,terrRRP:{},terrOv:{}};}
  return {
    headers:sn.headers,data:sn.original,
    kept:sn.kept.map(unpack),dropped:sn.dropped.map(unpack),
    cfg:sn.cfg,hasQty:sn.hasQty,hasBarcode:sn.hasBarcode,
    cur:sn.cur,margin:sn.margin,terr:sn.terr,type:sn.type,vname:sn.vname,dept:sn.dept,
    dummyRRP:sn.dummyRRP,totals:sn.totals,counts:sn.counts,
    trackerRow:sn._trackerRow||null,nextRow:(gtOn()&&GTSTATE.nextRow)?GTSTATE.nextRow:null,
    createdDate:sn._createdDate||''};}

/* ===== REVIEW CHECKS =====
   Surfaces the things a planner would otherwise have to open the file to see. */
function reviewChecks(sn){
  var out=[],i,rw;
  /* Tolerate partial snapshots. An older or hand-edited PO can arrive without a
     dropped array, and concat(undefined) yields [undefined] - which then threw
     on the first property read and took the whole Planning page down with it.
     A review panel must never be the reason a page fails to render. */
  var kept=Array.isArray(sn.kept)?sn.kept:[];
  var drop=Array.isArray(sn.dropped)?sn.dropped:[];
  var all=kept.concat(drop).filter(function(r){return r&&typeof r==='object';});
  var cur=sn.cur||'';

  /* --- RRP check --- */
  var zero=0,belowCost=0,minR=null,maxR=null;
  for(i=0;i<all.length;i++){
    rw=all[i];
    var rrp=Number(rw.re)||0;
    if(rrp<=0)zero++;
    if(rrp>0&&Number(rw.ce)>rrp)belowCost++;
    if(rrp>0){if(minR===null||rrp<minR)minR=rrp;if(maxR===null||rrp>maxR)maxR=rrp;}}
  if(zero)out.push({level:'bad',label:'RRP missing or zero',
    detail:zero+' of '+all.length+' rows have no usable RRP. Those lines will price at zero cost.'});
  else out.push({level:'ok',label:'RRP present on every row',
    detail:'Range '+cur+' '+(minR!=null?minR.toFixed(2):'0')+' to '+cur+' '+(maxR!=null?maxR.toFixed(2):'0')+' ex-VAT.'});
  if(belowCost)out.push({level:'bad',label:'Cost exceeds RRP',
    detail:belowCost+' row'+(belowCost!==1?'s':'')+' would be bought above their retail price. Check the margin.'});

  /* --- margin check --- */
  var mg=Number(sn.margin)||0;
  if(mg<=0)out.push({level:'bad',label:'Margin not set',detail:'Margin is '+mg+'%, so cost equals RRP ex-VAT.'});
  else if(mg<15)out.push({level:'warn',label:'Margin unusually low',detail:mg+'% - confirm this is intended before approving.'});
  else if(mg>70)out.push({level:'warn',label:'Margin unusually high',detail:mg+'% - confirm the vendor has agreed this.'});
  else out.push({level:'ok',label:'Margin '+mg+'%',detail:'Cost is '+(100-mg)+'% of RRP ex-VAT.'});

  /* --- new vs replenishment mapping --- */
  var t=sn.totals||{};
  var mapped=(t.newC||0)+(t.replC||0);
  if(!sn.hasBarcode)out.push({level:'bad',label:'New / Replenishment not mapped',
    detail:'No barcode column was found in the vendor sheet, so no line could be checked against the PID master.'});
  else if(t.unkC)out.push({level:'warn',label:'Partially mapped',
    detail:(t.newC||0)+' New, '+(t.replC||0)+' Replenishment, '+t.unkC+' with a barcode that matched nothing. Confirm the PID dump was current.'});
  else if(mapped)out.push({level:'ok',label:'New / Replenishment mapped',
    detail:(t.newC||0)+' New and '+(t.replC||0)+' Replenishment, every line matched.'});

  /* --- drops --- */
  var cts=sn.counts||{};
  if(cts.dropped)out.push({level:'warn',label:cts.dropped+' row'+(cts.dropped!==1?'s':'')+' dropped',
    detail:(cts.lowCount?cts.lowCount+' below the '+DROP_MIN_COUNT+'-size minimum. ':'')+
      (cts.kids?cts.kids+' kids clothing. ':'')+
      (cts.kidsKept?cts.kidsKept+' kids non-clothing kept. ':'')+
      (cts.ambiguous?cts.ambiguous+' kids but category unclear, kept. ':'')+
      'Replenishment lines are never dropped.'});
  else out.push({level:'ok',label:'Nothing dropped',detail:'Every New line met the size minimum and none were kids clothing.'});

  /* --- option integrity --- */
  if(cts.kept===0)out.push({level:'bad',label:'PO sheet is empty',detail:'Every row was dropped. There is nothing to raise.'});
  return out;}

/* ===== IN-DASHBOARD SHEET VIEWER =====
   Opens the same four tabs the Excel file would have, so a reviewer never has to
   download anything to make a decision. */
var SHEET_VIEW_ROWS=250;

/* Rebuilds the EXACT column layout the Excel writer produces, so a cell
   reference shown in the viewer (K7, L7...) is the same reference the planner
   would find after opening the downloaded file. Kept in one place so the two
   can never drift apart. */
function viewerColumns(sn){
  if(!sn.headers)sn.headers=[];
  if(!Array.isArray(sn.kept))sn.kept=[];
  if(!Array.isArray(sn.dropped))sn.dropped=[];
  if(!Array.isArray(sn.original))sn.original=[];
  if(!sn.counts)sn.counts={kept:sn.kept.length,dropped:sn.dropped.length,original:sn.original.length};
  function L(c){var s='';c++;while(c>0){c--;s=String.fromCharCode(65+(c%26))+s;c=Math.floor(c/26);}return s;}
  var h=sn.headers,origLen=h.length,cols=[],i;
  for(i=0;i<origLen;i++)cols.push({label:h[i],kind:'orig',idx:i});
  function add(label,kind){cols.push({label:label,kind:kind,idx:cols.length});return cols.length-1;}
  var cConcat=add('CONCAT','concat');
  var cCount=add('COUNT','count');
  var cOpts=add('OPTIONS','options');
  var cRrpEx=add('RRP EX-VAT ('+sn.cur+')','rrpex');
  var cCostEx=add('COST EX-VAT ('+sn.cur+')','costex');
  var cMargin=add('MARGIN %','margin');
  var cTotal=sn.hasQty?add('TOTAL VALUE ('+sn.cur+')','total'):-1;
  var dummies=[];
  if(sn.dummyRRP){
    var all=['UAE','KSA','KWT','QAT'];
    for(i=0;i<all.length;i++)if(all[i]!==sn.terr)dummies.push({terr:all[i],idx:add('DUMMY RRP '+all[i],'dummy')});}
  var cType=-1,cPid=-1;
  if(sn.hasBarcode){cType=add('TYPE','type');cPid=add('PID SOURCE','pidsrc');}

  /* same source-column detection the writer uses */
  var rrpSrc=-1,qtySrc=-1,styleSrc=-1,colorSrc=-1;
  for(i=0;i<origLen;i++){
    var hl=String(h[i]||'').toLowerCase();
    if(rrpSrc<0&&(hl.indexOf('rrp')>=0||hl.indexOf('msrp')>=0||hl.indexOf('srp')>=0))rrpSrc=i;
    if(sn.hasQty&&qtySrc<0&&(hl.indexOf('qty')>=0||hl.indexOf('quantity')>=0))qtySrc=i;
    if(styleSrc<0&&(hl.indexOf('style')>=0||hl==='sku'))styleSrc=i;
    if(colorSrc<0&&(hl.indexOf('colour')>=0||hl.indexOf('color')>=0))colorSrc=i;}
  return {L:L,cols:cols,origLen:origLen,cConcat:cConcat,cCount:cCount,cOpts:cOpts,
    cRrpEx:cRrpEx,cCostEx:cCostEx,cMargin:cMargin,cTotal:cTotal,dummies:dummies,
    cType:cType,cPid:cPid,rrpSrc:rrpSrc,qtySrc:qtySrc,styleSrc:styleSrc,colorSrc:colorSrc};}

/* Formula text for one calculated cell - mirrors the writer exactly. */
function viewerFormula(sn,V,kind,exRow,lastRow,dummyTerr){
  var L=V.L;
  var vatDiv=(sn.cfg&&sn.cfg.vat&&sn.cfg.vat!==1)?'/'+sn.cfg.vat:'';
  var marginMult=(100-Number(sn.margin||0))/100;
  var rrpRef=(V.rrpSrc>=0?L(V.rrpSrc):L(V.cRrpEx))+exRow;
  switch(kind){
    case 'concat':
      return (V.styleSrc>=0&&V.colorSrc>=0)?'='+L(V.styleSrc)+exRow+'&'+L(V.colorSrc)+exRow:null;
    case 'count':
      return '=COUNTIF('+L(V.cConcat)+'$2:'+L(V.cConcat)+'$'+lastRow+','+L(V.cConcat)+exRow+')';
    case 'options':
      return '=IF(COUNTIF('+L(V.cConcat)+'$2:'+L(V.cConcat)+exRow+','+L(V.cConcat)+exRow+')=1,1,0)';
    case 'rrpex':
      return V.rrpSrc>=0?'='+L(V.rrpSrc)+exRow+vatDiv:null;
    case 'costex':
      return '='+L(V.cRrpEx)+exRow+'*'+marginMult;
    case 'margin':
      return '=IF('+L(V.cRrpEx)+exRow+'=0,"",ROUND((1-'+L(V.cCostEx)+exRow+'/'+L(V.cRrpEx)+exRow+')*100,1))';
    case 'total':
      return V.qtySrc>=0?'='+L(V.cCostEx)+exRow+'*'+L(V.qtySrc)+exRow:null;
    case 'dummy':
      var rule=DUMMY_RULES[dummyTerr];
      return rule?'=ROUND('+rrpRef+rule.expr+','+rule.dp+')':null;
    default:return null;}}

function sheetViewerModal(po,opts){

  sn._trackerRow=po.trackerRow||null;sn._createdDate=po.createdDate||'';
  var V=viewerColumns(sn);
  var showAllFormulas=false;
  var m=el('div','modal');m.style.maxWidth='1180px';
  m.innerHTML='<div class="mh"><h3>&#128202; '+po.poNumber+' &middot; '+po.supplier+' &middot; '+po.brand+'</h3>'+
      '<button class="ib" id="svX">&#10005;</button></div>'+
    '<div class="mb" style="max-height:74vh">'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'+
        '<div class="dtabs" id="svTabs" style="display:inline-flex">'+
          '<button class="dtab on" data-t="po">PO Sheet ('+sn.counts.kept+')</button>'+
          '<button class="dtab" data-t="summary">Summary</button>'+
          '<button class="dtab" data-t="dropped">Dropped ('+sn.counts.dropped+')</button>'+
          '<button class="dtab" data-t="original">Original ('+sn.counts.original+')</button>'+
          '<button class="dtab" data-t="remarks">Remarks ('+allRemarks(po).length+')</button>'+
        '</div>'+
        '<label id="svFxWrap" style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto">'+
          '<input type="checkbox" id="svFxAll" style="width:15px;height:15px"> Show all formulas</label>'+
      '</div>'+
      /* formula bar, styled like a spreadsheet */
      '<div id="svBar" class="fxbar"><span class="fxref" id="svRef">&mdash;</span>'+
        '<span class="fxfx">fx</span>'+
        '<span class="fxval" id="svVal">Click any cell to inspect it</span></div>'+
      (sn.truncated?'<div style="padding:8px 11px;background:rgba(232,112,58,.09);border:1px solid rgba(232,112,58,.3);border-radius:8px;font-size:11px;color:var(--acc);margin-bottom:10px">&#9888; Large sheet &mdash; the viewer holds the first '+SHEET_ROW_CAP+' rows per tab. Totals are for the whole file; download the Excel for every row.</div>':'')+
      '<div id="svBody"></div>'+
    '</div>'+
    '<div class="mf" id="svFoot"></div>';
  openM(m);
  $('#svX').onclick=closeM;

  function setBar(ref,formula,value){
    $('#svRef').textContent=ref||'\u2014';
    var v=$('#svVal');
    if(formula){v.innerHTML='<b style="color:var(--pri2)">'+String(formula).replace(/[&<>]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[x];})+'</b>'+
      (value!=null&&value!==''?'<span style="color:var(--muted)"> &nbsp;&rarr;&nbsp; '+value+'</span>':'');}
    else v.innerHTML=(value==null||value==='')?'<span style="color:var(--muted)">(empty)</span>':String(value);}

  function poTable(){
    var lastRow=sn.kept.length+1;
    var lim=Math.min(SHEET_VIEW_ROWS,sn.kept.length);
    var th='<thead><tr><th class="rowno"></th>';
    for(var c=0;c<V.cols.length;c++){
      var isCalc=V.cols[c].kind!=='orig';
      th+='<th'+(isCalc?' style="background:rgba(68,114,196,.14)"':'')+'>'+
        '<span style="color:var(--muted);font-weight:800">'+V.L(c)+'</span> '+V.cols[c].label+'</th>';}
    th+='</tr></thead><tbody>';
    for(var r=0;r<lim;r++){
      var rw=sn.kept[r];var exRow=r+2;
      th+='<tr><td class="rowno">'+exRow+'</td>';
      for(var ci=0;ci<V.cols.length;ci++){
        var col=V.cols[ci];var val='',f=null;
        if(col.kind==='orig'){val=rw.o[col.idx];if(val==null)val='';}
        else if(col.kind==='concat'){val=rw.c;f=viewerFormula(sn,V,'concat',exRow,lastRow);}
        else if(col.kind==='count'){val=rw.n;f=viewerFormula(sn,V,'count',exRow,lastRow);}
        else if(col.kind==='options'){val='';f=viewerFormula(sn,V,'options',exRow,lastRow);}
        else if(col.kind==='rrpex'){val=Number(rw.re).toFixed(2);f=viewerFormula(sn,V,'rrpex',exRow,lastRow);}
        else if(col.kind==='costex'){val=Number(rw.ce).toFixed(2);f=viewerFormula(sn,V,'costex',exRow,lastRow);}
        else if(col.kind==='margin'){val=Number(sn.margin).toFixed(1);f=viewerFormula(sn,V,'margin',exRow,lastRow);}
        else if(col.kind==='total'){val=rw.tv==null?'':Number(rw.tv).toFixed(2);f=viewerFormula(sn,V,'total',exRow,lastRow);}
        else if(col.kind==='dummy'){
          var dm=null;for(var d=0;d<V.dummies.length;d++)if(V.dummies[d].idx===ci)dm=V.dummies[d];
          var rule=dm?DUMMY_RULES[dm.terr]:null;
          var base=Number(rw.re)*((sn.cfg&&sn.cfg.vat)||1);
          var dv=dm?(dm.terr==='KSA'?base/1.05*1.15:dm.terr==='KWT'?base*0.084:base):0;
          var fac=Math.pow(10,rule?rule.dp:2);
          val=(Math.round(dv*fac)/fac).toFixed(rule?rule.dp:2);
          f=dm?viewerFormula(sn,V,'dummy',exRow,lastRow,dm.terr):null;}
        else if(col.kind==='type'){val=rw.t||'';}
        else if(col.kind==='pidsrc'){val=rw.ps||'';}
        var ref=V.L(ci)+exRow;
        var disp=showAllFormulas&&f?f:(val===''?'<span style="color:var(--grey)">&mdash;</span>':String(val));
        var cls=f?'cellf':'';
        th+='<td class="'+cls+'" data-ref="'+ref+'" data-v="'+String(val).replace(/"/g,'&quot;')+'"'+
          (f?' data-f="'+String(f).replace(/"/g,'&quot;')+'"':'')+'>'+disp+'</td>';}
      th+='</tr>';}
    return {html:th+'</tbody>',shown:lim,total:sn.kept.length};}

  function plainTable(rowsSrc,extraCols){

      if(extraCols.length){
        th+='<td style="text-align:center">'+rw.n+'</td>'+
          '<td><span class="tag '+(rw.t==='New'?'tg-pend':rw.t==='Replenishment'?'tg-ok':'tg-gr')+'" style="font-size:10px">'+(rw.t||'&mdash;')+'</span></td>'+
          '<td style="color:var(--red);font-size:11px;white-space:normal;min-width:220px">'+((rw.rs||[]).join('; ')||'&mdash;')+'</td>';}

  function wire(){
    var body=$('#svBody');

    for(var i=0;i<cells.length;i++){(function(td){
      td.onclick=function(){

      '<div class="ts sheetview" style="max-height:44vh"><table>'+t.html+'</table></div></div>';

  var tabs=m.querySelectorAll('#svTabs .dtab');

/* ===== DOWNLOAD FROM ANY ROLE ===== */
function downloadPOExcel(po){
  if(!po.sheet){toast('No sheet stored for this PO - it was raised before sheet storage was added',true);return;}
  if(!xlsxReady()){toast('Excel library blocked by your network',true);return;}
  /* stamp the live tracker row onto the snapshot so the Summary tab carries it */
  po.sheet._trackerRow=po.trackerRow||null;
  po.sheet._createdDate=po.createdDate||'';
  buildWorkbookFromCtx(ctxFromSnapshot(po.sheet),po.poNumber);
  logA('Downloaded Excel',ST.role.charAt(0).toUpperCase()+ST.role.slice(1),po.poNumber);}

/* ===== PLANNING ACTIONS (shared by card and viewer) ===== */
/* Approvals are independent - a PO can be approved in any order, on its own or
   in bulk. State changes and the repaint happen first; everything slow (mail,
   sheet sync) is deferred so a single click always lands immediately. */
function approveOne(po){
  if(po.approval==='Approved')return false;
  po.approval='Approved';
  if(po.stageIdx<=1){po.stageIdx=QC_STAGE_IDX;po.stage=FLOWS[po.type][QC_STAGE_IDX];}
  logA('Approved','Planning',po.poNumber);
  return true;}

function afterApprove(pos){
  setTimeout(function(){
    /* sheet sync is per PO - each needs its own row */
    for(var i=0;i<pos.length;i++)if(gtOn())gtPushPO(pos[i],true);
    /* mail is ONE message for the whole batch. Firing per PO per event meant
       approving four POs opened eleven drafts, which is unusable. */
    if(pos.length===1){
      var po=pos[0];
      notifyEvent('approved','PO approved \u00b7 '+po.poNumber,
        po.poNumber+' has been approved by Planning. Operations now owns the remaining stages.\n\n'+poLine(po),po);
      sendNotification('operations','PO Approved \u00b7 '+po.poNumber,
        'PO '+po.poNumber+' for '+po.supplier+' / '+po.brand+' has been APPROVED by Planning.');
    }else{
      var lines=pos.map(function(p){
        return '\u2022 '+p.poNumber+' \u2014 '+p.supplier+' / '+p.brand+' \u2014 '+p.currency+' '+(p.value||0).toLocaleString()+
          (p.trackerRow?(' \u2014 row '+p.trackerRow):'');}).join('\n');
      notifyEvent('approved',pos.length+' POs approved by Planning',
        'Planning has approved '+pos.length+' POs:\n\n'+lines,pos[0]);
      sendNotification('operations',pos.length+' POs approved',
        'Planning has approved '+pos.length+' POs:\n\n'+lines);}
  },0);}

function planningApprove(po){
  if(!approveOne(po)){toast('Already approved');return;}
  sv();renderPage();toast('Approved '+po.poNumber);
  afterApprove([po]);}

function planningApproveMany(pos){
  var done=[];
  for(var i=0;i<pos.length;i++)if(approveOne(pos[i]))done.push(pos[i]);
  if(!done.length){toast('Nothing to approve');return;}
  sv();PLSEL={};renderPage();
  toast('Approved '+done.length+' PO'+(done.length!==1?'s':''));
  afterApprove(done);}
function planningReject(po){
  var r=prompt('Rejection reason?');if(r==null)return;
  po.approval='Rejected';po.rejectReason=r;sv();logA('Rejected','Planning',po.poNumber+': '+r);
  renderPage();
  sendNotification('operations','PO Rejected &middot; '+po.poNumber,
    'PO '+po.poNumber+' for '+po.supplier+' / '+po.brand+' has been REJECTED by Planning.\nReason: '+r);
  setTimeout(function(){
    notifyEvent('rejected','PO rejected \u00b7 '+po.poNumber,
      po.poNumber+' has been rejected by Planning.\nReason: '+r+'\n\n'+poLine(po),po);},0);
  toast('Rejected '+po.poNumber);}

function planningRejectMany(pos){
  var r=prompt('Rejection reason for '+pos.length+' PO'+(pos.length!==1?'s':'')+'?');
  if(r==null)return;
  for(var i=0;i<pos.length;i++){pos[i].approval='Rejected';pos[i].rejectReason=r;
    logA('Rejected','Planning',pos[i].poNumber+': '+r);}
  sv();PLSEL={};renderPage();toast('Rejected '+pos.length+' PO'+(pos.length!==1?'s':''));

    sendNotification('operations',pos.length+' POs rejected',
      'Planning has rejected '+pos.length+' POs.\nReason: '+r+'\n\n'+pos.map(function(p){return '\u2022 '+p.poNumber;}).join('\n'));},0);}

function advStage(po){
  var flow=FLOWS[po.type];
  if(po.stageIdx===0&&po.approval!=='Approved'){toast('Needs Planning approval first',true);return;}
  if(po.stageIdx===QC_STAGE_IDX){
    /* the gate is QC's SIGN-OFF, not QC's presence. Once QC has approved, the PO
       belongs to Operations and they move it on - previously only the QC role
       could advance, so every PO stalled here waiting for someone who had
       already done their part. */
    if(!po.qc||po.qc.approval!=='Approved'){
      toast('QC must be Approved before this stage can be passed',true);return;}
    if(ST.role!=='qc'&&ST.role!=='operations'&&ST.role!=='buyer'){
      toast('Only QC or Operations can advance past '+flow[QC_STAGE_IDX],true);return;}
  }
  if(po.stageIdx<flow.length-1){
    var from=po.stage;
    po.stageIdx++;po.stage=po.stageIdx===flow.length-1?'Completed':flow[po.stageIdx];
    sv();logA('Advanced',po.type,po.poNumber+' -> '+po.stage);
    notifyStage(po,from,po.stage);
    if(gtOn())gtPushPO(po,true);
    renderPage();toast('Stage: '+po.stage);}}

/* move directly to a stage from the Operations checklist */
function setStage(po,idx){
  var flow=FLOWS[po.type];
  if(idx<0||idx>flow.length-1)return;
  if(po.approval!=='Approved'){toast('Needs Planning approval first',true);return;}
  if(idx>QC_STAGE_IDX&&(!po.qc||po.qc.approval!=='Approved')){
    toast('QC must be Approved before moving past '+flow[QC_STAGE_IDX],true);return;}
  var from=po.stage;
  po.stageIdx=idx;po.stage=idx>=flow.length-1?'Completed':flow[idx];
  sv();logA('Stage set',po.type,po.poNumber+' -> '+po.stage);
  notifyStage(po,from,po.stage);
  if(gtOn())gtPushPO(po,true);
  renderPage();toast('Stage: '+po.stage);}

/* ===== REMARKS =====
   One thread per PO, shown identically in every view. Entries written elsewhere
   in the app - Item Creation comments, QC comments, a Planning rejection reason -
   are folded into the same timeline read-only, so a reviewer never has to know
   which screen a note was typed on to find it. */
function allRemarks(po){
  var out=[],i;
  var rem=po.remarks||[];
  for(i=0;i<rem.length;i++)
    out.push({ts:rem[i].ts,role:rem[i].role,text:rem[i].text,stage:rem[i].stage,tag:'Remark'});
  var ic=(po.itemCreation&&po.itemCreation.comments)||[];
  for(i=0;i<ic.length;i++)
    out.push({ts:ic[i].ts,role:ic[i].role,text:ic[i].text+(ic[i].status?(' ['+ic[i].status+']'):''),
      stage:'Item Creation',tag:'Item Creation'});
  if(po.qc&&po.qc.comments)
    out.push({ts:po.qc.lastUpdated||po.createdDate||'',role:po.qc.owner||'qc',
      text:po.qc.comments,stage:'QC / Content',tag:'QC'});
  if(po.qc&&po.qc.delayed==='Yes'&&po.qc.delayNote)
    out.push({ts:po.qc.lastUpdated||'',role:'qc',
      text:'DELAY \u2014 '+(po.qc.delayReason||'')+': '+po.qc.delayNote,stage:'QC / Content',tag:'Delay'});
  if(po.rejectReason)
    out.push({ts:'',role:'planning',text:'REJECTED \u2014 '+po.rejectReason,stage:'Approval',tag:'Planning'});
  out.sort(function(a,b){return String(b.ts||'').localeCompare(String(a.ts||''));});
  return out;}

var REM_TAGCLS={'Remark':'mp','Item Creation':'tg-gr','QC':'tg-pend','Delay':'tg-no','Planning':'cn'};

function addRemark(poId,ctx){
  var po=null;

  if(!po){toast('PO not found',true);return;}

    po.qc.delayed=nDel;po.qc.delayReason=nDR;po.qc.delayOther=nDRO;po.qc.delayNote=nDN;po.qc.delayImages=(nDel==='Yes'?tmpImgs.slice():[]);po.qc.lastUpdated=ts;
    if(po.qc.approval==='Approved'&&po.stageIdx===QC_STAGE_IDX)advStage(po);
    sv();logA('QC saved','QC',po.poNumber+(nDel==='Yes'?' | DELAYED: '+nDR:''));
    notifyEvent('qc','QC '+(nA||'updated')+' \u00b7 '+po.poNumber,
      'QC has been updated on '+po.poNumber+'.\n\nStatus: '+(nS||'\u2014')+'\nApproval: '+(nA||'\u2014')+
      '\nOwner: '+(nO||'\u2014')+(nDel==='Yes'?('\nDELAYED: '+nDR+(nDN?(' \u2014 '+nDN):'')):'')+
      (nC?('\nComments: '+nC):'')+'\n\n'+poLine(po),po);
    if(gtOn())gtPushPO(po,true);
    closeM();renderPage();toast('QC saved');};}

/* ===== GOOGLE TRACKER INTEGRATION =====
   Two-way bridge to the "GO LIVE 2" sheet via an Apps Script Web App.
   Reading:  polled, so a change made in Google shows up here on its own.
   Writing:  a PO is appended at the next free row and the row number comes back
             and is stored on the PO, so the app and the sheet agree on where it
             lives. Append is idempotent on PO number, so a retry or a double
             click updates the existing row instead of duplicating it.

   Column layout of the tracker (A..BI, 61 columns) is declared once below.
   If a column is inserted in Google, change GT_COLS and nothing else. */
var GT_CFGKEY='po_gtracker_cfg';
var GT={url:'',secret:''};
var GTSTATE={loaded:false,busy:false,err:'',headers:[],rows:[],firstRow:0,
  lastDataRow:0,nextRow:0,updated:'',poll:null,byPo:{}};

/* 0-based index -> tracker column. Keep in the sheet's own order. */
var GT_COLS=['Territory','Department','Brand','Supplier Name','PO Creation Entitiy',
  'Outright/ Consigment','Buyer Name','Submission for PO creation Date','PI Submission',
  'Image Submission','Order Type','Stock ready for pickup Date','Delivery type',
  'New Options','New qty','Replenishment Options','Repl qty','Total Option','Total Qty',
  'PO Val','PO currency','PO Special condition','PO Creation Date','Po Number',
  'Sort / NON Sort / Import','PO Qty','PO Net Cost','PO Currency','PO creation Type',
  'ODN Submission','ODN Submission Date','Cam Pushed Date','Dropped Options',
  'Image Received Options','Not Received Options','GO live','Ops Comments',
  'Expected Pick up date','ASN Request Date','ASN Number','Checklist Dump Shared',
  'pickup Current Status','Actual Pick up Date','GRN Qty','GRN Date','GRN Qty KSA',
  'GRN Date KSA','GRN Qty UAE','GRN Date UAE','GRN Qty KWT','GRN Date KWT',
  'GRN Qty QAT','GRN Date QAT','PO Not Created Pendency','Pending Deliveries',
  'Pick Up Service Level','CDC Transfer Timeline KSA','CDC Transfer Timeline UAE',
  'CDC Transfer Timeline KWT','CDC Transfer Timeline QTR','Sock / Transfer Order for MDC'];

/* The tracker records Outright vs Consignment. Marketplace is a different
   commercial model, so it is passed through rather than guessed at - confirm
   with the team which value they want and change it here if needed. */
var GT_MODEL={Consignment:'Consignment',Marketplace:'Marketplace'};

/* OWNERSHIP BOUNDARY
   A..U (the first 21 columns, up to and including "PO currency") is raised by
   this app and written to the sheet the moment a PO is created - before Planning
   approval, so the row exists for the team to work on.
   V..BI is filled by the team inside Google. The app never writes there and
   reads those values back for display, so the sheet stays the single source of
   truth for operational fields. */
var GT_WRITE_COLS=21;

function gtLoadCfg(){
  try{var raw=lsGet(GT_CFGKEY);if(raw){var c=JSON.parse(raw);if(c&&c.url){GT=c;return;}}}catch(e){}
  if(DB&&DB.prefs&&DB.prefs.gtracker&&DB.prefs.gtracker.url)GT=DB.prefs.gtracker;}
function gtSaveCfg(c){
  GT=c;lsSet(GT_CFGKEY,JSON.stringify(c));
  DB.prefs.gtracker=c;sv();}
function gtOn(){return !!(GT&&GT.url);}

/* --- option counts split by New / Replenishment, from the stored sheet --- */
function gtOptionSplit(po){
  var res={newOpt:0,newQty:0,replOpt:0,replQty:0};
  if(!po.sheet||!Array.isArray(po.sheet.kept))return res;
  var seenNew={},seenRepl={};
  for(var i=0;i<po.sheet.kept.length;i++){
    var r=po.sheet.kept[i];
    var q=Number(r.q)||0;
    if(r.t==='Replenishment'){
      if(!seenRepl[r.c]){seenRepl[r.c]=1;res.replOpt++;}
      res.replQty+=q;
    }else{
      if(!seenNew[r.c]){seenNew[r.c]=1;res.newOpt++;}
      res.newQty+=q;}}
  return res;}

function gtOrderType(po){
  var sp=gtOptionSplit(po);
  if(sp.newOpt&&sp.replOpt)return 'Reorder+ New';
  if(sp.replOpt)return 'Reorder';
  if(sp.newOpt)return 'New';
  return '';}

/* --- read --- */
function gtFetchMeta(cfg){
  var u=(cfg||GT).url+'?action=meta'+((cfg||GT).secret?'&secret='+encodeURIComponent((cfg||GT).secret):'');
  return fetch(u).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok)throw new Error((j&&j.error)||'Bridge returned no data');
    return j;});}

function gtPull(opts){
  opts=opts||{};
  if(!gtOn())return Promise.resolve(false);
  GTSTATE.busy=true;gtRefreshUI();
  var u=GT.url+'?action=rows&limit='+(opts.limit||250)+(GT.secret?'&secret='+encodeURIComponent(GT.secret):'');
  return fetch(u).then(function(r){return r.json();}).then(function(j){
    GTSTATE.busy=false;
    if(!j||!j.ok)throw new Error((j&&j.error)||'Bridge error');
    var changed=(GTSTATE.lastDataRow!==j.lastDataRow);
    GTSTATE.headers=j.headers||[];
    GTSTATE.rows=j.rows||[];
    GTSTATE.firstRow=j.firstRowNumber||0;
    GTSTATE.lastDataRow=j.lastDataRow||0;
    GTSTATE.nextRow=j.nextRow||0;
    GTSTATE.updated=j.updated||'';
    /* index by PO number so the tracker can show what the team typed in V..BI */
    var poIx=GT_COLS.indexOf('Po Number');
    GTSTATE.byPo={};
    for(var bi=0;bi<GTSTATE.rows.length;bi++){
      var key=String(GTSTATE.rows[bi][poIx]||'').trim();
      if(key)GTSTATE.byPo[key.toUpperCase()]={row:GTSTATE.firstRow+bi,cells:GTSTATE.rows[bi]};}
    GTSTATE.loaded=true;GTSTATE.err='';
    gtRefreshUI();
    return {changed:changed};
  }).catch(function(err){
    GTSTATE.busy=false;
    GTSTATE.err=(err&&err.message)||'Could not reach the Google bridge';
    gtRefreshUI();return false;});}

function gtStartPolling(){
  if(GTSTATE.poll)clearInterval(GTSTATE.poll);
  if(!gtOn())return;
  GTSTATE.poll=setInterval(function(){
    if(document.hidden||GTSTATE.busy)return;
    gtPull({}).then(function(r){
      if(r&&r.changed&&ST.page==='tracker'){renderPage();toast('Google tracker updated');}});},30000);}

/* --- write --- */
function gtPushPO(po,silent){
  if(!gtOn()){if(!silent)toast('Connect the Google tracker first (Masters & Settings)',true);return Promise.resolve(false);}
  /* Column X holds the team's own PO number, so it can no longer be used to find
     our row. The row number returned on first write is the durable link - use it
     for every later sync, and only fall back to append if we have not got one. */
  var body=po.trackerRow
    ? {action:'update',row:po.trackerRow,values:gtWriteRowForPO(po),writeCols:GT_WRITE_COLS}
    : {action:'append',po:po.poNumber,values:gtWriteRowForPO(po),writeCols:GT_WRITE_COLS};
  if(GT.secret)body.secret=GT.secret;
  if(!silent)toast('Writing to Google tracker\u2026');
  /* text/plain on purpose: application/json would trigger a CORS preflight that
     Apps Script cannot answer, and the request would fail before arriving */
  return fetch(GT.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){
    if(!j||!j.ok)throw new Error((j&&j.error)||'Bridge refused the write');
    /* A reply with ok:true but no row number means the deployed script did not
       actually write - almost always the minimal TEST script still being live,
       whose doPost returns ok without touching the sheet. Treat it as a failure
       rather than reporting a success that never happened. */
    if(!j.row){
      throw new Error('The bridge replied but wrote nothing (no row number returned). '+
        'The deployed script is probably still the minimal test version \u2014 paste the full '+
        'google-apps-script.gs into Code.gs, save, then Deploy \u2192 Manage deployments \u2192 New version.');}
    po.trackerRow=j.row;po.trackerSyncedAt=new Date().toISOString();
    sv();logA('Synced to Google tracker','Tracker',po.poNumber+' -> row '+j.row);
    if(!silent)toast(j.action==='updated-existing'?
      ('Updated existing row '+j.row):('Added at row '+j.row));
    gtPull({});
    return j;
  }).catch(function(err){
    /* .then(onOk,onErr) would NOT catch a throw inside onOk - the rejection would
       go unhandled and the user would see nothing at all. .catch covers both the
       network failure and our own validation throw. */
    var msg=(err&&err.message)||'unknown error';
    GTSTATE.err=msg;gtRefreshUI();
    if(!silent)toast('Sheet write failed: '+msg,true);
    else logA('Sheet write failed','Tracker',(po.poNumber||'')+': '+msg);
    return false;});}

function gtRefreshUI(){

  if(b){
    b.textContent=gtOn()
      ?(GTSTATE.err?'\u26a0 Google tracker: '+GTSTATE.err

/* ===== DETAILED TRACKER =====
   The column set IS the Google tracker's column set (GT_COLS, 61 columns A..BI)
   so the app and the sheet are the same shape. One function decides every cell
   value - the table, the edit form, the Excel export and the row written to
   Google all read from it, so they cannot disagree.

   Columns fall into two kinds:
     AUTO   - derived from the PO by the engine and workflow. Read-only here,
              because editing a copy of a derived number just creates a second
              version of the truth.
     MANUAL - operational fields nobody can derive (ASN numbers, GRN dates,
              pickup status). Stored on po.gtx keyed by the sheet's own column
              name, so inserting a column in Google does not shift the data. */

var GT_AUTO={
  'Territory':function(po){return po.territory||'';},
  'Department':function(po){return po.department||'';},
  'Brand':function(po){return po.brand||'';},
  'Supplier Name':function(po){return po.supplier||'';},
  'PO Creation Entitiy':function(po){return po.entity||'';},
  'Outright/ Consigment':function(po){return GT_MODEL[po.type]||po.type||'';},
  'Buyer Name':function(po){return po.buyer||'';},
  'Submission for PO creation Date':function(po){return po.createdDate||'';},
  'Order Type':function(po){return gtOrderType(po);},
  'New Options':function(po){return gtOptionSplit(po).newOpt||0;},
  'New qty':function(po){return gtOptionSplit(po).newQty||0;},
  'Replenishment Options':function(po){return gtOptionSplit(po).replOpt||0;},
  'Repl qty':function(po){return gtOptionSplit(po).replQty||0;},
  'Total Option':function(po){return po.totalOptions||0;},
  'Total Qty':function(po){return po.totalQty||0;},
  'PO Val':function(po){return po.value||0;},
  'PO currency':function(po){return po.currency||'';},
  'PO Creation Date':function(po){return po.createdDate||'';},
  'Po Number':function(po){return po.poNumber||'';},
  'PO Qty':function(po){return po.totalQty||0;},
  'PO Net Cost':function(po){return po.value||0;},
  'PO Currency':function(po){return po.currency||'';},
  'Dropped Options':function(po){return (po.sheet&&po.sheet.counts)?po.sheet.counts.dropped:'';},
  'GO live':function(po){return (po.stage==='Go Live'||po.stage==='Completed')?'Live':'';}};

/* older POs kept these under po.extra - read them so nothing is lost */
var GT_LEGACY={'PI Submission':'_piSub','Image Submission':'_imgSub',
  'Stock ready for pickup Date':'_stockReady','Delivery type':'_delivType',
  'PO Special condition':'_specialCond','Sort / NON Sort / Import':'_delivType',
  'Ops Comments':'_opsComments','ASN Number':'_asnNum',
  'GRN Qty':'_grnQty','GRN Date':'_grnDate','pickup Current Status':'_pickup',
  'GRN Qty KSA':'_cdcKSA','GRN Qty UAE':'_cdcUAE','GRN Qty KWT':'_cdcKWT','GRN Qty QAT':'_cdcQAT'};

/* The PO number the team types into the sheet (column X) is the real ERP number.
   Ours is a tracking code. Both matter, so both are shown - never conflated. */
function gtSheetPoNumber(po){
  var sr=gtSheetRow(po);
  if(!sr)return '';
  var ix=GT_COLS.indexOf('Po Number');
  var v=(ix>=0)?sr.cells[ix]:'';
  v=String(v==null?'':v).trim();
  return (v&&v!==po.poNumber)?v:'';}

function gtSheetRow(po){
  if(!po||!po.poNumber)return null;
  var hit=GTSTATE.byPo&&GTSTATE.byPo[String(po.poNumber).toUpperCase()];
  return hit||null;}

function gtCellValue(po,name){
  var ix=GT_COLS.indexOf(name);
  /* PRECEDENCE, and the order matters:
     1. From column V onward the SHEET wins outright - including over anything the
        engine could derive. Several derivable columns (PO Qty, PO Net Cost, GO
        live, Dropped Options) live past U, and the team's typed value is the
        real one once they have filled it. Checking AUTO first would show a stale
        or blank engine value on top of their work.
     2. Then the engine's derived value, which for a sheet-owned column acts as a
        sensible default until the team fills it.
     3. Then anything entered here in the app, then the legacy extra fields. */
  if(ix>=GT_WRITE_COLS){
    var sr=gtSheetRow(po);
    if(sr&&sr.cells[ix]!=null&&String(sr.cells[ix]).trim()!=='')
      return {v:sr.cells[ix],auto:true,src:'sheet'};}
  if(GT_AUTO[name])return {v:GT_AUTO[name](po),auto:true,src:'engine'};
  var v=(po.gtx&&po.gtx[name]!=null)?po.gtx[name]:null;
  if((v===null||v==='')&&GT_LEGACY[name]&&po.extra)v=po.extra[GT_LEGACY[name]];
  return {v:(v==null?'':v),auto:false,src:'app'};}

function gtSetCell(po,name,val){
  if(GT_AUTO[name])return false;      /* never overwrite a derived value */
  if(!po.gtx)po.gtx={};
  po.gtx[name]=val;
  return true;}

/* the row written to Google is exactly what the tracker shows */
/* full 61-wide row, used for display and export */
function gtRowForPO(po){
  var v=[];
  for(var i=0;i<GT_COLS.length;i++)v.push(gtCellValue(po,GT_COLS[i]).v);
  return v;}

/* only the block this app owns, A..U - what actually gets written to Google */
function gtWriteRowForPO(po){
  var v=[];
  for(var i=0;i<GT_WRITE_COLS;i++)v.push(gtCellValue(po,GT_COLS[i]).v);
  return v;}

var dtSrch='',dtTab='app';
function pgTracker(c){

    (gtOn()?', two-way synced':'')+'.'+(type?' Filtered: <b>'+type+' &middot; '+filter+'</b>':'')+'</p>'));

  /* --- source tabs + live status --- */

function exportTracker(pos){

/* --- push every approved PO that is not in the sheet yet --- */
function gtPushAll(){
  if(!gtOn()){toast('Connect the sheet first',true);return;}
  var todo=[];
  for(var i=0;i<DB.pos.length;i++){
    var p=DB.pos[i];
    if(p.approval==='Approved'&&p.stage!=='Cancelled')todo.push(p);}
  if(!todo.length){toast('Nothing approved to sync');return;}
  if(!confirm('Sync '+todo.length+' approved PO'+(todo.length!==1?'s':'')+' to the GO LIVE 2 sheet?\n\nPOs already in the sheet are updated in place, not duplicated.'))return;
  toast('Syncing '+todo.length+' POs\u2026');
  var done=0,failed=0;
  /* sequential on purpose - the bridge takes a script lock per write, and firing
     them in parallel just makes them queue behind each other and time out */
  function next(ix){
    if(ix>=todo.length){
      renderPage();
      toast('Synced '+done+' PO'+(done!==1?'s':'')+(failed?', '+failed+' failed':''),failed>0);
      return;}
    gtPushPO(todo[ix],true).then(function(r){
      if(r)done++;else failed++;
      next(ix+1);});}
  next(0);}

/* ===== DATA FILE: DOWNLOAD / UPLOAD / MERGE =====
   Carries the whole working dataset around as .json. Upload at the start of a
   session, download at the end. Needed when browser storage is blocked
   (sandboxed preview, locked-down browser) or when moving between machines.

   Upload accepts SEVERAL files at once and shows exactly what is inside each
   before anything is written, then offers two modes:
     MERGE   - keeps what is loaded and folds the files in on top. POs match on
               id, then trackingId/poNumber. Master lists, brands, vendors and
               notification recipients are unioned. Activity logs are combined,
               de-duplicated and re-sorted. Nothing is silently dropped.
     REPLACE - discards what is loaded and rebuilds purely from the files.
   Where a PO exists on both sides in MERGE, the incoming file wins, because the
   file is the thing you just chose to load. Every add/update is counted and
   reported afterwards so the result is never a guess. */
var DIRTY=false;
function markDirty(){DIRTY=true;var b=$('#dataBtn');if(b)b.classList.add('dirty');}
function clearDirty(){DIRTY=false;var b=$('#dataBtn');if(b)b.classList.remove('dirty');}

function dataCounts(d){
  d=d||DB;
  return {pos:((d&&d.pos)||[]).length,vendors:((d&&d.vendors)||[]).length,
    brands:((d&&d.brands)||[]).length,activity:((d&&d.activity)||[]).length,
    masters:(d&&d.masters)?Object.keys(d.masters).length:0,
    recipients:(d&&d.prefs&&d.prefs.notify)?
      ((d.prefs.notify.planning||[]).length+(d.prefs.notify.operations||[]).length):0};}

    data:DB};
  var d=new Date();
  var name='po-data-'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes())+'.json';
  try{
