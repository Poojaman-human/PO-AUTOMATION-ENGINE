<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PO Automation Engine</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
/* Corporate networks and proxies often block CDNs. If the Excel library did not
   load from the primary host, try a second one before the app gives up. The app
   still works without it - it falls back to CSV - but Excel output with live
   formulas needs this library. */
if(typeof XLSX==='undefined'){
  document.write('<script src="https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"><\/script>');
}
</script>
<style>
:root{--bg:#f0f4fb;--surf:#fff;--surf2:#f7f9ff;--bdr:#e4e8f2;--txt:#1a2236;--muted:#6b7390;
--pri:#1f3864;--pri2:#4472c4;--acc:#e8703a;--grn:#2e9e6b;--yel:#d4920a;--red:#d64545;--grey:#9aa1b8;
--sh:0 1px 4px rgba(20,30,60,.07),0 6px 20px rgba(20,30,60,.07);--r:13px;--sb:240px}
.dk{--bg:#0d1220;--surf:#151c2c;--surf2:#1a2235;--bdr:#253048;--txt:#e6eaf5;--muted:#8892b0;--sh:0 1px 4px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sb);background:var(--surf);border-right:1px solid var(--bdr);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;transition:width .22s;z-index:50;overflow:hidden}
.sidebar.col{width:60px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--bdr);min-height:60px}
.logo{min-width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--acc));display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.brand-t{font-weight:800;font-size:14px;white-space:nowrap}
.sidebar.col .brand-t,.sidebar.col .nl,.sidebar.col .sf-t{display:none}
.nav{flex:1;padding:8px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;color:var(--muted);font-weight:600;white-space:nowrap;margin-bottom:2px;cursor:pointer;transition:.15s}
.ni .ic{min-width:20px;text-align:center;font-size:15px}
.ni:hover{background:var(--surf2);color:var(--txt)}
.ni.active{background:var(--pri);color:#fff}
.sf{padding:8px;border-top:1px solid var(--bdr)}
.sf-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:600;width:100%;cursor:pointer}
.sf-btn:hover{background:var(--surf2)}
.main{flex:1;margin-left:var(--sb);transition:margin .22s;min-width:0}
.main.exp{margin-left:60px}
.topbar{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:52px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;flex:1;min-width:120px}
.bk{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;background:var(--surf2);border:1px solid var(--bdr);font-weight:600;font-size:13px;cursor:pointer}
.bk:hover{border-color:var(--pri2)}
.rp label{font-size:11px;color:var(--muted);font-weight:700;margin-right:5px}
.rp select{padding:6px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);font-weight:600}
.ib{width:36px;height:36px;border-radius:8px;background:var(--surf2);border:1px solid var(--bdr);display:grid;place-items:center;font-size:15px;cursor:pointer}
.ib:hover{border-color:var(--pri2)}
.pg{padding:22px;max-width:1600px;margin:0 auto}
.ph h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
.ph p{color:var(--muted);margin-top:3px;font-size:13px}
.ph{margin-bottom:18px}
.sec{font-size:14px;font-weight:800;margin:22px 0 10px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;transition:.18s}
.kpi:hover{transform:translateY(-2px);border-color:var(--pri2)}
.kpi .kt{display:flex;justify-content:space-between;align-items:flex-start}
.kpi .ki{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.kpi .kv{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-1px}
.kpi .kl{color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.mp{background:rgba(68,114,196,.13);color:var(--pri2)}
.cn{background:rgba(232,112,58,.14);color:var(--acc)}
.tg-ok{background:rgba(46,158,107,.14);color:var(--grn)}
.tg-pend{background:rgba(212,146,10,.14);color:var(--yel)}
.tg-no{background:rgba(214,69,69,.14);color:var(--red)}
.tg-gr{background:rgba(154,161,184,.14);color:var(--grey)}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surf2);border:1px solid var(--bdr);color:var(--muted)}
.tw{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tt{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;align-items:center}
.srch{display:flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:7px 11px;flex:1;min-width:160px}
.srch input{border:none;background:none;outline:none;color:var(--txt);width:100%}
.ts{overflow-x:auto;max-height:58vh}
table{width:100%;border-collapse:collapse;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surf2);text-align:left;padding:10px 13px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--bdr);z-index:2}
tbody td{padding:10px 13px;border-bottom:1px solid var(--bdr);font-size:13px}
tbody tr:hover{background:var(--surf2)}
tbody tr:last-child td{border-bottom:none}
.empty{padding:48px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px;opacity:.45}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;transition:.15s;border:1px solid transparent;cursor:pointer}
.bp{background:var(--pri);color:#fff}.bp:hover{background:var(--pri2)}
.bg{background:var(--surf2);border-color:var(--bdr);color:var(--txt)}.bg:hover{border-color:var(--pri2)}
.bd{background:rgba(214,69,69,.11);color:var(--red)}.bd:hover{background:var(--red);color:#fff}
.bs{padding:5px 10px;font-size:12px}
.ra{display:flex;gap:5px}
.ia{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;background:var(--surf2);border:1px solid var(--bdr);font-size:13px;cursor:pointer}
.ia:hover{border-color:var(--pri2)}
.ia.d:hover{border-color:var(--red);color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s}
@keyframes pop{from{transform:scale(.96) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bdr)}
.mh h3{font-size:16px;font-weight:800}
.mb{padding:20px;max-height:68vh;overflow-y:auto}
.mf{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.f input,.f select,.f textarea{padding:8px 11px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri2)}
.sub{background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;padding:12px;grid-column:1/-1}
.sub h4{font-size:12px;font-weight:800;margin-bottom:10px;text-transform:uppercase;color:var(--muted)}
.tw2{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surf);border:1px solid var(--bdr);border-left:4px solid var(--grn);border-radius:10px;padding:11px 16px;box-shadow:var(--sh);font-weight:600;min-width:220px;animation:si .22s}
.toast.e{border-left-color:var(--red)}
@keyframes si{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
.tl{display:flex;align-items:flex-start;padding:10px 4px;overflow-x:auto;gap:0}
.tl.v{flex-direction:column;padding:4px 10px}
.tn{display:flex;flex-direction:column;align-items:center;position:relative;min-width:88px}
.tn.v{flex-direction:row;align-items:flex-start;min-height:52px;min-width:0}
.td{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;z-index:1;flex-shrink:0}
.tla{font-size:10px;font-weight:600;text-align:center;color:var(--muted);margin-top:5px;max-width:76px;line-height:1.3}
.tn.v .tla{margin-top:5px;margin-left:10px;text-align:left;max-width:none;font-size:12px}
.tline{height:3px;flex:1;min-width:16px;align-self:center;margin-bottom:18px}
.tline.v{width:3px;min-height:18px;margin-left:13px;height:auto}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(212,146,10,.2)}50%{box-shadow:0 0 0 8px rgba(212,146,10,.07)}}
.step-bar{display:flex;align-items:center;gap:0;margin-bottom:24px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.step .sn{width:28px;height:28px;border-radius:50%;background:var(--bdr);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800}
.step.done .sn{background:var(--grn);color:#fff}
.step.active .sn{background:var(--pri);color:#fff}
.step.active{color:var(--txt)}
.step-line{flex:1;height:2px;background:var(--bdr);min-width:20px}
.step-line.done{background:var(--grn)}
.sumtable{width:100%;border-collapse:collapse;margin-top:8px}
.sumtable td{padding:8px 12px;border:1px solid var(--bdr);font-size:13px}
.sumtable .lbl{background:var(--pri);color:#fff;font-weight:700;width:40%}
.sumtable .auto{background:rgba(46,158,107,.08)}
.sumtable .stat{background:rgba(212,146,10,.08)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 11px;border-radius:20px;background:var(--surf2);border:1px solid var(--bdr);font-size:12px;font-weight:600}
.chip button{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--bdr);font-size:10px;cursor:pointer}
.chip button:hover{background:var(--red);color:#fff}
.madd{display:flex;gap:6px;margin-top:8px}
.madd input{flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);outline:none;font-size:13px}
.irow{display:flex;gap:8px;align-items:center}
.irow select,.irow input{flex:1;padding:8px 11px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);outline:none}
.divider{border:none;border-top:1px solid var(--bdr);margin:12px 0}
@media(max-width:820px){.sidebar{transform:translateX(-100%)}.sidebar.mob{transform:none}.main,.main.exp{margin-left:0}.fg{grid-template-columns:1fr}.mbt{display:grid!important}}
.mbt{display:none}
.lock-scr{position:fixed;inset:0;background:linear-gradient(135deg,var(--pri),#0d1a33);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--surf);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:28px;width:100%;max-width:360px}
.lock-card .logo{margin:0 auto 14px}
.lock-h{text-align:center;font-weight:800;font-size:17px;margin-bottom:2px}
.lock-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px}
.lock-err{color:var(--red);font-size:12px;text-align:center;min-height:16px;margin-top:6px;font-weight:600}
.terr-pnl{background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-top:14px}
.terr-pnl h4{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.terr-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.terr-row label{font-size:12px;font-weight:700}
.terr-row select,.terr-row input{padding:6px 9px;border-radius:7px;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);font-size:12px}
.tcell{width:88px;padding:5px 6px;border-radius:6px;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);font-size:12px}
.tcell.ov{border-color:var(--acc);background:rgba(232,112,58,.08)}
.tcell-rst{width:20px;height:20px;border-radius:5px;background:var(--surf2);border:1px solid var(--bdr);font-size:10px;cursor:pointer;display:inline-grid;place-items:center;margin-left:3px}

/* ===== DASHBOARD ===== */
.kpi.on{border-color:var(--pri2);box-shadow:0 0 0 2px rgba(68,114,196,.22),var(--sh)}
.kpi .kd{font-size:11px;font-weight:700;margin-top:6px;color:var(--muted)}
.dfilters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.dfl{display:flex;flex-direction:column;gap:4px;min-width:130px}
.dfl.grow{flex:1;min-width:180px}
.dfl label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dfl select,.dfl input{padding:7px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);outline:none;font-weight:600;font-size:13px}
.dfl select:focus,.dfl input:focus{border-color:var(--pri2)}
.dstrip{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.dchip{background:var(--surf);border:1px solid var(--bdr);border-radius:11px;box-shadow:var(--sh);padding:10px 14px;min-width:130px}
.dchip .vl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dchip .vv{font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-.4px}
.dgrid{display:grid;gap:14px;margin-bottom:14px}
.dg21{grid-template-columns:2fr 1fr}
.dg3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1040px){.dg21,.dg3{grid-template-columns:1fr}}
.dch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.dch h3{font-size:14px;font-weight:800}
.dcsub{font-size:12px;color:var(--muted);margin-bottom:14px}
.dtabs{display:flex;gap:4px;background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:3px}
.dtab{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted)}
.dtab.on{background:var(--pri);color:#fff}
.dbar{display:grid;grid-template-columns:112px 1fr 66px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px}
.dbar .bl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtrack{height:9px;border-radius:5px;background:var(--surf2);overflow:hidden;border:1px solid var(--bdr)}
.dfill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dbar .bv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.dbar .bv small{font-weight:600;color:var(--muted)}
.dfn{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;margin-bottom:7px}
.dfn-num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--surf2);border:1px solid var(--bdr);color:var(--muted)}
.dfn-num.done{background:var(--grn);color:#fff;border-color:var(--grn)}
.dfn-num.here{background:var(--yel);color:#fff;border-color:var(--yel)}
.dfn-bar{position:relative;height:26px;border-radius:7px;background:var(--surf2);border:1px solid var(--bdr);overflow:hidden}
.dfn-fill{position:absolute;inset:0 auto 0 0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dfn-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.dfn-lbl .r{font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;color:var(--muted)}
.dfn-lbl .r b{color:var(--yel)}
.dwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:'';position:absolute;inset:26px;border-radius:50%;background:var(--surf)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}
.donut-c b{font-size:24px;font-weight:800;letter-spacing:-1px;display:block;line-height:1}
.donut-c span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.dlegend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.dlg{display:flex;align-items:center;gap:8px;font-size:12px}
.dlg .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dlg .ln{flex:1;color:var(--muted);font-weight:600}
.dlg .lv{font-weight:800;font-variant-numeric:tabular-nums}
.dcols{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.dcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.dcol .stack{width:100%;border-radius:4px 4px 0 0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.dcol .seg{width:100%}
.dcol .cl{font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dfeed{max-height:250px;overflow-y:auto}
.dfr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr);font-size:12px;align-items:flex-start}
.dfr:last-child{border-bottom:none}
.dfd{width:7px;height:7px;border-radius:50%;background:var(--pri2);margin-top:5px;flex-shrink:0}
.dfb{flex:1;min-width:0}
.dfb div{color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dft{color:var(--muted);font-size:11px;white-space:nowrap}
.dmini{padding:26px!important}
/* --- spreadsheet-style viewer --- */
.fxbar{display:flex;align-items:center;gap:0;border:1px solid var(--bdr);border-radius:8px;overflow:hidden;margin-bottom:10px;background:var(--surf)}
.fxref{min-width:74px;padding:7px 10px;background:var(--surf2);border-right:1px solid var(--bdr);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums;text-align:center}
.fxfx{padding:7px 10px;border-right:1px solid var(--bdr);font-style:italic;font-weight:700;color:var(--muted);font-size:12px}
.fxval{padding:7px 11px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:nowrap;flex:1}
.sheetview table{border-collapse:separate;border-spacing:0}
.sheetview td{cursor:cell;transition:background .1s}
.sheetview td.cellf{background:rgba(68,114,196,.05)}
.sheetview td.cellf:hover{background:rgba(68,114,196,.16)}

<script>
(function(){
/* ===== SAFE STORAGE =====
   Some environments block browser storage completely and throw a SecurityError
   the moment localStorage is even READ — sandboxed iframes / preview panes
   (about:srcdoc without allow-same-origin), hardened corporate browser policies,
   and Chrome with third-party storage blocked. Accessing it unguarded kills the
   whole script, so every read/write goes through these wrappers instead.
   If storage is unavailable we fall back to an in-memory store: the app runs
   completely normally, but data is lost when the tab is closed or reloaded.
   Save the file to disk and open it directly for persistence to work. */
var MEMSTORE={},SESSSTORE={},STORAGE_OK=true;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){STORAGE_OK=false;return (k in MEMSTORE)?MEMSTORE[k]:null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){STORAGE_OK=false;MEMSTORE[k]=v;}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return (k in SESSSTORE)?SESSSTORE[k]:null;}}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){SESSSTORE[k]=v;}}

/* ===== SHARED / ONLINE STORAGE =====
   localStorage is per-browser, so putting this file on a URL does NOT by itself
   give a team shared data - ten people would get ten private empty copies.
   This layer adds a shared backend and picks whatever is available at runtime:

     'supabase'  - a free hosted Postgres with a REST API. Works on ANY host
                   (Netlify, GitHub Pages, an internal IIS box, a file on a
                   shared drive). Configured in-app, no code editing.
     'artifact'  - window.storage, present only when running inside a published
                   Claude artifact. Auto-detected.
     none        - falls back to localStorage (private) or memory + the Data
                   panel's download/upload.

   Config travels three ways, in priority order:
     1. #cfg=... in the URL   -> one link carries the settings to everybody
     2. localStorage          -> remembered per browser once entered
     3. CLOUD_PRESET below    -> paste it here to bake it into the file itself

   The whole dataset is one JSON blob, so a sync is one read and one write.
   Writes are debounced; conflicts are last-write-wins; a poll picks up other
   people's edits. Only cloudPull and cloudPush touch the network, so swapping
   in a different backend later means editing two functions. */

/* Optional: hardcode your settings here so every visitor is connected with no
   setup at all. Leave null to configure from the Data panel instead. */
var CLOUD_PRESET={mode:'supabase',url:'https://slgajzokzlbcxssybtbd.supabase.co',key:'sb_publishable_yEx9V59kESTmy_08mLFuRA_xJZo1Kl8',table:'po_state',row:'main'};
/* example:
var CLOUD_PRESET={mode:'supabase',url:'https://xxxx.supabase.co',
  key:'eyJhbGciOi...your anon public key...',table:'po_state',row:'main'};
*/

var CFGKEY='po_cloud_cfg';
var CLOUD=null,CLOUD_OK=false,CLOUD_MODE='';
var cloudTimer=null,cloudBusy=false,lastSyncAt=0,cloudErr='',cloudPoll=null;

function b64enc(o){try{return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}catch(e){return '';}}
function b64dec(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}}

function loadCloudCfg(){
  /* 1. from the link */
  try{
    var h=String(location.hash||'');
    var m=h.match(/cfg=([^&]+)/);
    if(m){
      var fromLink=b64dec(decodeURIComponent(m[1]));
      if(fromLink&&fromLink.url&&fromLink.key){
        lsSet(CFGKEY,JSON.stringify(fromLink));
        return fromLink;}}
  }catch(e){}
  /* 2. remembered in this browser */
  try{
    var raw=lsGet(CFGKEY);
    if(raw){var c=JSON.parse(raw);if(c&&c.url&&c.key)return c;}
  }catch(e){}
  /* 3. baked into the file */
  if(CLOUD_PRESET&&CLOUD_PRESET.url&&CLOUD_PRESET.key)return CLOUD_PRESET;
  return null;}

function saveCloudCfg(c){lsSet(CFGKEY,JSON.stringify(c));}
function clearCloudCfg(){
  try{localStorage.removeItem(CFGKEY);}catch(e){delete MEMSTORE[CFGKEY];}
  CLOUD=null;CLOUD_OK=false;CLOUD_MODE='';
  if(cloudPoll){clearInterval(cloudPoll);cloudPoll=null;}
  updateSyncBadge();}

function hasArtifactStore(){
  try{return !!(window.storage&&typeof window.storage.get==='function'&&typeof window.storage.set==='function');}
  catch(e){return false;}}

/* ---------- supabase REST helpers ---------- */
function sbHeaders(c,extra){
  /* The apikey header is what the gateway authenticates on. Authorization:Bearer
     is only added for legacy JWT keys (eyJ...); the newer publishable keys
     (sb_publishable_...) are not JWTs and some gateways reject them as bearer
     tokens with a 401, so we deliberately leave that header off for those. */
  var h={'apikey':c.key,'Content-Type':'application/json'};
  if(/^eyJ/.test(String(c.key||'')))h['Authorization']='Bearer '+c.key;
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;}
function sbUrl(c){
  var base=String(c.url).replace(/\/+$/,'');
  return base+'/rest/v1/'+(c.table||'po_state');}

function sbRead(c){
  var u=sbUrl(c)+'?id=eq.'+encodeURIComponent(c.row||'main')+'&select=data,updated_at,updated_by';
  return fetch(u,{headers:sbHeaders(c)}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' '+t.slice(0,90));});
    return r.json();}).then(function(rows){
    if(!rows||!rows.length)return null;
    return {value:rows[0].data,at:rows[0].updated_at,by:rows[0].updated_by};});}

function sbWrite(c,obj){
  /* upsert so the first save works even if the row was never inserted */
  var body=[{id:(c.row||'main'),data:obj,updated_at:new Date().toISOString(),updated_by:ST.role}];
  return fetch(sbUrl(c),{method:'POST',
    headers:sbHeaders(c,{'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(body)}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' '+t.slice(0,90));});
    return true;});}

/* ---------- backend-agnostic read / write ---------- */
function backendRead(){
  if(CLOUD_MODE==='artifact'){
    return window.storage.get('po_automation_db',true).then(function(res){
      if(!res||!res.value)return null;
      var env;try{env=JSON.parse(res.value);}catch(e){return null;}
      return {value:(env&&env.data)?env.data:env,at:env&&env._savedAt,by:env&&env._by};});}
  return sbRead(CLOUD);}

function backendWrite(dbObj){
  if(CLOUD_MODE==='artifact'){
    return window.storage.set('po_automation_db',
      JSON.stringify({_savedAt:new Date().toISOString(),_by:ST.role,_v:1,data:dbObj}),true);}
  return sbWrite(CLOUD,dbObj);}

/* ---------- push (debounced) ---------- */
function cloudPush(){
  if(!CLOUD_OK)return;
  if(cloudTimer)clearTimeout(cloudTimer);
  cloudTimer=setTimeout(function(){
    cloudTimer=null;
    var snapshot=JSON.parse(JSON.stringify(DB));
    var size=JSON.stringify(snapshot).length;
    if(size>4600000){
      cloudErr='Dataset too large to sync (~'+Math.round(size/1048576)+'MB). Remove some QC delay images.';
      updateSyncBadge();toast('Sync skipped: too large. Download a backup.',true);return;}
    cloudBusy=true;updateSyncBadge();
    backendWrite(snapshot).then(function(){
      cloudBusy=false;cloudErr='';lastSyncAt=Date.now();clearDirty();updateSyncBadge();
    },function(err){
      cloudBusy=false;cloudErr=(err&&err.message)||'Sync failed';updateSyncBadge();
      toast('Could not save to shared database',true);});
  },700);}

/* ---------- pull ---------- */
function cloudPull(opts){
  opts=opts||{};
  if(!CLOUD_OK)return Promise.resolve(false);
  return backendRead().then(function(res){
    if(!res||!res.value)return false;
    var incoming=res.value;
    if(typeof incoming==='string'){try{incoming=JSON.parse(incoming);}catch(e){return false;}}
    if(incoming&&incoming.data&&Array.isArray(incoming.data.pos))incoming=incoming.data;
    if(!incoming||!Array.isArray(incoming.pos))return false;
    var stamp=res.at?new Date(res.at).getTime():0;
    if(!opts.force&&stamp&&stamp<=lastSyncAt)return false;
    if(!opts.force&&DIRTY&&!opts.initial)return false;  /* never clobber unsaved local edits */
    DB=fillGaps(incoming);
    for(var i=0;i<DB.pos.length;i++)normalisePO(DB.pos[i]);
    lastSyncAt=stamp||Date.now();
    lsSet(DBK,JSON.stringify(DB));
    clearDirty();
    return {by:res.by||'',at:res.at||''};
  },function(err){
    cloudErr=(err&&err.message)||'Could not reach shared database';
    updateSyncBadge();return false;});}

/* ---------- start up ---------- */
function cloudInit(){
  var cfg=loadCloudCfg();
  if(cfg){CLOUD=cfg;CLOUD_MODE=cfg.mode||'supabase';CLOUD_OK=true;}
  else if(hasArtifactStore()){CLOUD_MODE='artifact';CLOUD_OK=true;}
  else{updateSyncBadge();return;}
  updateSyncBadge();
  cloudPull({initial:true}).then(function(r){
    if(r){
      if(DB.prefs.theme==='dk')document.body.classList.add('dk');else document.body.classList.remove('dk');
      ST.hist=[];go(RLANDING[ST.role],{},false);
      toast('Loaded shared data \u2014 '+DB.pos.length+' PO'+(DB.pos.length!==1?'s':''));
    }else{
      if(DB.pos.length||DB.vendors.length)cloudPush();  /* seed an empty shared store */
      renderPage();}
    updateSyncBadge();
    if(cloudPoll)clearInterval(cloudPoll);
    cloudPoll=setInterval(function(){
      if(document.hidden||cloudBusy||DIRTY)return;
      cloudPull({}).then(function(r2){
        if(r2){renderPage();updateSyncBadge();toast('Updated from '+(r2.by||'shared database'));}});},20000);});}

/* ---------- status ---------- */
function syncState(){
  if(CLOUD_OK){
    if(cloudErr)return {cls:'warn',txt:'\u26a0 Shared DB: '+cloudErr};
    if(cloudBusy)return {cls:'ok',txt:'\u21bb Syncing\u2026'};
    return {cls:'ok',txt:'\u2713 Online \u2014 shared'+(CLOUD_MODE==='supabase'?' database':'')};}
  if(STORAGE_OK)return {cls:'warn',txt:'\u25cf Local only \u2014 not shared'};
  return {cls:'warn',txt:'\u26a0 Storage blocked \u2014 memory only'};}

function updateSyncBadge(){
  var b=$('#syncBadge');if(!b)return;
  var st=syncState();
  b.textContent=st.txt;
  b.className='syncbadge '+st.cls;
  b.title=CLOUD_OK?'Click to manage the shared database':'Click to connect a shared database';
  var d=$('#DP');if(d&&d.classList.contains('on'))renderDataPanel();}

/* ---------- forgiving paste handling ----------
   People paste whole lines off the Supabase dashboard
   (NEXT_PUBLIC_SUPABASE_URL=https://x.supabase.co), and copying from a web page
   can carry zero-width characters that survive .trim() and break a naive regex.
   Rather than making the user hunt for an invisible character, pull the value
   out of whatever arrives. */
function stripInvisible(v){
  return String(v==null?'':v)
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')  /* zero-width + BOM */
    .replace(/[\u00A0\u2028\u2029]/g,' ')          /* nbsp, line/para separators */
    .trim();}
function cleanPlain(v){return stripInvisible(v).replace(/^["'`]+|["'`]+$/g,'');}
function cleanUrlInput(v){
  var t=cleanPlain(v);
  if(!t)return '';
  /* pull the first URL out of a pasted env line or code snippet */
  var m=t.match(/https?:\/\/[^\s"'`,;)]+/i);
  if(m)t=m[0];
  else{
    t=t.replace(/^[A-Z0-9_]+\s*[=:]\s*/i,'');            /* KEY= prefix */
    t=t.replace(/^[^A-Za-z0-9]+/,'');                     /* leading junk */
    if(/^[A-Za-z0-9-]+\.[A-Za-z0-9.-]+/.test(t))t='https://'+t;  /* bare host */
  }
  return t.replace(/\/+$/,'').replace(/\/rest\/v1.*$/i,'');}
function cleanKeyInput(v){
  var t=cleanPlain(v);
  if(!t)return '';
  var m=t.match(/(sb_publishable_[A-Za-z0-9_\-]+|sb_secret_[A-Za-z0-9_\-]+|eyJ[A-Za-z0-9_\-\.]+)/);
  if(m)return m[0];
  return t.replace(/^[A-Z0-9_]+\s*[=:]\s*/i,'');}

/* ---------- setup modal ---------- */
function cloudSetupModal(){
  var c=CLOUD||{mode:'supabase',url:'',key:'',table:'po_state',row:'main'};
  var m=el('div','modal');m.style.maxWidth='620px';
  m.innerHTML='<div class="mh"><h3>&#127760; Shared database</h3><button class="ib" id="csX">&#10005;</button></div>'+
    '<div class="mb">'+
      '<p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px">'+
        'Connect a free Supabase project so everyone opening this app sees the same POs. '+
        'One-time setup, about three minutes. Without it the app still works, but each person\'s data stays on their own machine.</p>'+
      '<div class="sub" style="margin-bottom:14px">'+
        '<h4>Setup steps</h4>'+
        '<ol style="margin:0 0 0 16px;font-size:12px;color:var(--muted);line-height:1.9">'+

            '<code style="display:block;background:var(--surf);border:1px solid var(--bdr);padding:8px;border-radius:6px;margin:5px 0;font-size:11px;white-space:pre-wrap">create table po_state (\n  id text primary key,\n  data jsonb not null,\n  updated_at timestamptz default now(),\n  updated_by text\n);\nalter table po_state enable row level security;\ncreate policy "anon rw" on po_state for all\n  using (true) with check (true);</code></li>'+
          '<li>Go to <b>Settings &rarr; API</b> and copy the <b>Project URL</b> and the <b>anon public</b> key</li>'+
          '<li>Paste both below and press <b>Test &amp; save</b></li>'+
        '</ol></div>'+
      '<div class="fg">'+
        '<div class="f full"><label>Project URL *</label><input id="cs_url" value="'+(c.url||'')+'" placeholder="https://xxxxxxxx.supabase.co"></div>'+
        '<div class="f full"><label>Anon public key *</label><input id="cs_key" value="'+(c.key||'')+'" placeholder="eyJhbGciOiJIUzI1NiIs..."></div>'+
        '<div class="f"><label>Table</label><input id="cs_table" value="'+(c.table||'po_state')+'"></div>'+
        '<div class="f"><label>Row id</label><input id="cs_row" value="'+(c.row||'main')+'"></div>'+
      '</div>'+
      '<div id="cs_msg" style="margin-top:12px;font-size:12px;font-weight:700;min-height:18px"></div>'+
      (CLOUD&&CLOUD.url?'<div class="sub" style="margin-top:14px"><h4>Share this app</h4>'+
        '<p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px">This link carries the connection settings, so colleagues are connected the moment they open it &mdash; no setup on their side.</p>'+
        '<div class="irow"><input id="cs_link" readonly value="'+cloudShareLink()+'" style="font-size:11px">'+
        '<button class="btn bp bs" type="button" id="cs_copy">Copy</button></div></div>':'')+
    '</div>'+
    '<div class="mf">'+
      (CLOUD&&CLOUD.url?'<button class="btn bd" id="cs_dis">Disconnect</button>':'')+
      '<button class="btn bg" id="cs_cancel">Cancel</button>'+
      '<button class="btn bp" id="cs_save">Test &amp; save</button>'+
    '</div>';
  openM(m);
  $('#csX').onclick=closeM;$('#cs_cancel').onclick=closeM;
  var cp=$('#cs_copy');
  if(cp)cp.onclick=function(){
    var i=$('#cs_link');i.select();
    try{document.execCommand('copy');toast('Link copied');}catch(e){toast('Select and copy manually',true);}};
  var ds=$('#cs_dis');
  if(ds)ds.onclick=function(){
    if(!confirm('Disconnect from the shared database?\n\nThis app goes back to storing data locally. Nothing in the database is deleted.'))return;
    clearCloudCfg();closeM();renderPage();toast('Disconnected \u2014 local storage only');};
  $('#cs_save').onclick=function(){
    var cfg={mode:'supabase',
      url:cleanUrlInput($('#cs_url').value),
      key:cleanKeyInput($('#cs_key').value),
      table:cleanPlain($('#cs_table').value)||'po_state',
      row:cleanPlain($('#cs_row').value)||'main'};
    var msg=$('#cs_msg');
    /* show the user what we actually parsed out of whatever they pasted */
    if(cfg.url)$('#cs_url').value=cfg.url;
    if(cfg.key)$('#cs_key').value=cfg.key;
    if(!cfg.url||!cfg.key){msg.style.color='var(--red)';msg.textContent='Project URL and key are both required.';return;}
    if(!/^https?:\/\/[^\s]+\.[^\s]+/.test(cfg.url)){
      msg.style.color='var(--red)';
      msg.textContent='That does not look like a project URL. It should be like https://abcdefgh.supabase.co';return;}

      setTimeout(function(){

          else{cloudPush();renderPage();toast('Connected \u2014 your data is now the shared copy');}
          if(cloudPoll)clearInterval(cloudPoll);
          cloudPoll=setInterval(function(){
            if(document.hidden||cloudBusy||DIRTY)return;
            cloudPull({}).then(function(r2){if(r2){renderPage();updateSyncBadge();toast('Updated from '+(r2.by||'shared database'));}});},20000);});
      },900);
    },function(err){
      msg.style.color='var(--red)';
      var em=(err&&err.message)||'Could not connect';
      var hint=' \u2014 check the URL, the key, that the po_state table exists, and that the RLS policy allows access.';
      if(/401|Invalid API key/i.test(em))
        hint=' \u2014 the key was rejected. In Supabase go to Settings \u2192 API Keys, open the "Legacy API keys" tab, and copy the "anon public" key (it starts with eyJ). Paste that here instead.';
      if(/404/.test(em))
        hint=' \u2014 the table was not found. Run the create table po_state SQL in the Supabase SQL Editor first.';
      msg.style.color='var(--red)';
      msg.textContent='\u2717 '+em+hint;});};}

function cloudShareLink(){

/* ===== EMAIL NOTIFICATIONS =====
   Supports multiple recipients per role (Planning / Operations). Each recipient can
   optionally have a Web3Forms Access Key attached for silent background sending;
   recipients without a key fall back to opening a pre-filled email draft instead.
   One-time setup per recipient (~1 min), done from Masters & Settings in the app:
     1) web3forms.com -> click "Create Access Key" -> enter that recipient's inbox email
        -> check that inbox for an email containing the Access Key
     2) Add the recipient in Masters & Settings -> Notification Recipients, pasting
        in the Access Key (optional — leave blank to just use the mail-app fallback) */
function initEmail(){}
function notifyList(role){return (DB.prefs.notify&&DB.prefs.notify[role])||[];}
function sendOne(email,key,subject,message){
  if(key){
    fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({access_key:key,subject:subject,message:message,from_name:'PO Automation Engine'})})
      .then(function(r){return r.json().then(function(j){if(r.ok&&j.success)toast('Emailed '+email);else toast('Email send failed for '+email+' — check Web3Forms key',true);});})
      .catch(function(){toast('Email send failed for '+email,true);});
  }else{
    openDraft([email],subject,message);}}

/* ONE draft for all keyless recipients, opened AFTER the UI has repainted.
   Opening a mailto: per recipient inline was the reason an approval felt like it
   had not registered - each window.open steals focus, and several in a row get
   throttled or popup-blocked, so the click appeared to do nothing. */
function openDraft(emails,subject,message){
  var to=emails.filter(Boolean).join(',');
  if(!to)return;
  setTimeout(function(){
    try{
      var url='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(String(subject).replace(/&middot;/g,'\u00b7').replace(/&[a-z]+;/g,' '))+
        '&body='+encodeURIComponent(message);
      window.open(url,'_blank');
      toast('Opened a draft for '+emails.length+' recipient'+(emails.length!==1?'s':''));
    }catch(e){toast('Could not open a mail draft',true);}
  },0);}

/* Split recipients: keyed ones send silently in the background, keyless ones are
   collected into a single deferred draft. */
function dispatch(list,subject,message){
  if(!list||!list.length)return;
  var drafts=[];
  for(var i=0;i<list.length;i++){
    if(!list[i]||!list[i].email)continue;
    if(list[i].key)sendOne(list[i].email,list[i].key,subject,message);
    else drafts.push(list[i].email);}
  if(drafts.length)openDraft(drafts,subject,message);}
function sendNotification(role,subject,message){dispatch(notifyList(role),subject,message);}

function renderEngNotifyChips(){
  /* NOTE: `role` must be captured inside the IIFE alongside the index. With `var`
     it is function-scoped, so every click handler would read the LAST role in the
     loop ('operations') and delete from the wrong list - the chip you clicked
     appeared to stay put while a different email silently disappeared.
     Removing by EMAIL rather than by index is also deliberate: indexes go stale
     if the list changes between render and click. */
  var roles=[['planning','e_plChips'],['operations','e_opChips']];
  for(var r=0;r<roles.length;r++){
    var role=roles[r][0];var elId=roles[r][1];
    var box=$('#'+elId);if(!box)continue;
    box.innerHTML='';
    var list=notifyList(role);
    if(!list.length){
      box.appendChild(el('div','','<span style="font-size:11px;color:var(--muted)">None added yet</span>'));
      continue;}
    for(var i=0;i<list.length;i++){
      (function(rl,email,hasKey){
        var chip=el('div','chip','<span>'+email+(hasKey?' &#9889;':'')+'</span>');
        var x=el('button',null,'&#10005;');
        x.title='Remove '+email;
        x.onclick=function(ev){
          if(ev){ev.preventDefault();ev.stopPropagation();}
          removeNotify(rl,email);};
        chip.appendChild(x);box.appendChild(chip);
      })(role,list[i].email,!!list[i].key);}}}

/* Remove by email address so it cannot hit the wrong entry. */
function removeNotify(role,email){
  if(!DB.prefs.notify||!DB.prefs.notify[role]){toast('Nothing to remove',true);return;}
  var list=DB.prefs.notify[role];
  for(var i=0;i<list.length;i++){
    if(String(list[i].email).toLowerCase()===String(email).toLowerCase()){
      list.splice(i,1);sv();
      renderEngNotifyChips();
      var d=$('#ncard_'+role);if(d)renderPage();
      toast('Removed '+email);return;}}
  toast('Already removed',true);}
function engAddNotify(role){
  var inp=$(role==='planning'?'#e_plAdd':'#e_opAdd');var v=(inp.value||'').trim();
  if(!v){toast('Enter an email',true);return;}
  if(!/^\S+@\S+\.\S+$/.test(v)){toast('Enter a valid email',true);return;}
  if(!DB.prefs.notify)DB.prefs.notify={planning:[],operations:[]};

function processSheet(){
  var fileEl=$('#e_file');if(!fileEl||!fileEl.files||!fileEl.files[0]){toast('Choose a file',true);return;}
  var file=fileEl.files[0];var ext=file.name.split('.').pop().toLowerCase();var reader=new FileReader();
  if(ext==='xlsx'||ext==='xls'){
    reader.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:'binary'});var ws=wb.Sheets[wb.SheetNames[0]];runProcess(XLSX.utils.sheet_to_csv(ws,{blankrows:false}));}catch(err){toast('Excel error: '+err.message,true);}};
    reader.readAsBinaryString(file);
  }else{reader.onload=function(e){runProcess(e.target.result);};reader.readAsText(file);}}

function parseCSV(txt){var rows=[],row=[],cur='',q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cur.trim());cur='';}
      else if(ch==='\n'||ch==='\r'){if(cur||row.length){row.push(cur.trim());rows.push(row);row=[];cur='';}}
      else cur+=ch;}}
  if(cur||row.length){row.push(cur.trim());if(row.some(function(x){return x!=='';}))rows.push(row);}
  return rows;}
function findCol(H,exacts,contains){var h=H.map(function(x){return x.toLowerCase().trim();});
  for(var i=0;i<exacts.length;i++){var idx=h.indexOf(exacts[i]);if(idx>=0)return idx;}
  if(contains)for(var c=0;c<h.length;c++)for(var s=0;s<contains.length;s++){var ok=true;for(var k=0;k<contains[s].length;k++){if(h[c].indexOf(contains[s][k])<0){ok=false;break;}}if(ok)return c;}
  return -1;}
function numv(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}

/* ===== PID MASTER DATA (barcode lookup for New vs Replenishment) =====
   Consignment PID file names should contain CENTREPOINT_CENTREPOINT.
   Marketplace PID file names should contain CENTREPOINT_ALL.
   Upload either from Masters & Settings -> PID Master Data. */
function detectPidSource(filename){
  var up=(filename||'').toUpperCase();
  if(up.indexOf('CENTREPOINT_CENTREPOINT')>=0)return 'consignment';
  if(up.indexOf('CENTREPOINT_ALL')>=0)return 'marketplace';
  return null;}
function loadPidDump(file,forcedSource){
  var source=forcedSource||detectPidSource(file.name);
  if(!source){toast('Could not tell Consignment vs Marketplace from the filename. Rename it to include CENTREPOINT_CENTREPOINT (Consignment) or CENTREPOINT_ALL (Marketplace), or pick manually below.',true);return;}
  var ext=file.name.split('.').pop().toLowerCase();var reader=new FileReader();
  function handle(csvText){
    var rows=parseCSV(csvText);
    if(rows.length<2){toast('PID file appears empty',true);return;}
    var headers=rows[0];
    var cBar=findCol(headers,['barcode','ean','upc','item barcode','sku barcode'],[['barcode'],['ean'],['upc']]);
    if(cBar<0){toast('No barcode/EAN/UPC column found in this PID file',true);return;}
    var map={};var cnt=0;
    for(var i=1;i<rows.length;i++){var b=String(rows[i][cBar]||'').trim();if(b){map[b]=true;cnt++;}}
    PID[source]={fileName:file.name,uploadedDate:new Date().toISOString().slice(0,10),barcodes:map,count:cnt};
    logA('Uploaded PID Dump',source==='consignment'?'Consignment PID':'Marketplace PID',file.name+' ('+cnt+' barcodes)');sv();
    updatePidStatus();toast(cnt+' barcodes loaded as '+(source==='consignment'?'Consignment':'Marketplace')+' PID');}
  if(ext==='xlsx'||ext==='xls'){
    reader.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:'binary'});var ws=wb.Sheets[wb.SheetNames[0]];handle(XLSX.utils.sheet_to_csv(ws,{blankrows:false}));}catch(err){toast('Excel error: '+err.message,true);}};
    reader.readAsBinaryString(file);
  }else{reader.onload=function(e){handle(e.target.result);};reader.readAsText(file);}}
function pidLookup(barcode){
  var b=String(barcode||'').trim();if(!b)return{matched:false,source:'',type:'Unknown'};
  if(PID.consignment.barcodes[b])return{matched:true,source:'Consignment',type:'Replenishment'};
  if(PID.marketplace.barcodes[b])return{matched:true,source:'Marketplace',type:'Replenishment'};
  return{matched:false,source:'',type:'New'};}
function updatePidStatus(){
  function lbl(d){return d.fileName?'&#10003; <b>'+d.fileName+'</b> &middot; '+d.count+' barcodes &middot; '+d.uploadedDate:'No file loaded yet';}
  var targets=[['pidSt_con',PID.consignment],['pidSt_mkt',PID.marketplace]];
  for(var i=0;i<targets.length;i++){var els=document.querySelectorAll('.'+targets[i][0]);for(var j=0;j<els.length;j++)els[j].innerHTML=lbl(targets[i][1]);}}

function runProcess(csvText){
  var all=parseCSV(csvText);if(all.length<2){toast('File appears empty',true);return;}
  var hdrIdx=0,best=0;
  for(var i=0;i<Math.min(3,all.length);i++){var cnt=0;for(var j=0;j<all[i].length;j++){if(all[i][j]&&isNaN(+all[i][j])&&all[i][j].length<80)cnt++;}if(cnt>best){best=cnt;hdrIdx=i;}}
  var headers=all[hdrIdx];var data=[];
  for(var r=hdrIdx+1;r<all.length;r++){var hv=false;for(var c=0;c<all[r].length;c++){if(all[r][c]!==''){hv=true;break;}}if(hv)data.push(all[r]);}
  var cStyle=findCol(headers,['style code','style no','sku','item code','style'],[['style'],['sku']]);
  var cColor=findCol(headers,['color','colour','style color','style colour','color name','colour name'],[['colour'],['color']]);
  var cRrp=findCol(headers,[],[['rrp']]);var cMsrp=findCol(headers,[],[['msrp']]);var cSrp=findCol(headers,[],[['srp']]);
  var hasQty=ENG.type==='Consignment';var cQty=hasQty?findCol(headers,['qty','quantity','order qty','order quantity','units'],[['qty'],['quantity']]):-1;
  var miss=[];if(cStyle<0)miss.push('Style/SKU');if(cColor<0)miss.push('Colour/Color');
  if(cRrp<0&&cMsrp<0&&cSrp<0)miss.push('RRP/MSRP/SRP');if(hasQty&&cQty<0)miss.push('QTY');
  if(miss.length){toast('Columns not found: '+miss.join(', '),true);return;}
  var cfg=TCFG[ENG.terr]||{vat:1,entity:''};var mult=(100-ENG.margin)/100;
  /* Barcode column for PID VLOOKUP (New vs Replenishment) */
  var cBarcode=findCol(headers,['barcode','ean','upc','item barcode','sku barcode'],[['barcode'],['ean'],['upc']]);
  var newC=0,replC=0,unkC=0;
  /* Territory-specific RRP columns (Consignment only) */
  var terrCols={};
  if(ENG.type==='Consignment'){
    for(var tk=0;tk<TERR_LIST.length;tk++){var terr=TERR_LIST[tk];var words=TERR_MATCH[terr];
      var pats=[];for(var w=0;w<words.length;w++){pats.push([words[w],'rrp']);pats.push([words[w],'msrp']);pats.push([words[w],'srp']);}
      var idx=findCol(headers,[],pats);if(idx>=0)terrCols[terr]=idx;}}
  var terrDetected=Object.keys(terrCols);
  var isMultiTerr=terrDetected.length>=2;
  var sourceTerr=terrDetected.length===1?terrDetected[0]:ENG.terr;
  var prevConcat=null,totalOpts=0,totalQty=0,totalValue=0,outRows=[];
  for(var d=0;d<data.length;d++){
    var row=data[d];var style=String(row[cStyle]||'').trim();var color=String(row[cColor]||'').trim();var concat=style+color;
    var opt=(d===0||concat!==prevConcat)?1:0;prevConcat=concat;totalOpts+=opt;
    var rrpRaw=Math.max(cRrp>=0?numv(row[cRrp]):0,cMsrp>=0?numv(row[cMsrp]):0,cSrp>=0?numv(row[cSrp]):0);
    var rrpEx=cfg.vat===1?rrpRaw:rrpRaw/cfg.vat;var costEx=rrpEx*mult;
    var qty=(hasQty&&cQty>=0)?numv(row[cQty]):null;var totalVal=(qty!==null&&qty>0)?costEx*qty:null;
    if(totalVal!==null){totalQty+=qty;totalValue+=totalVal;}
    var barcode=cBarcode>=0?String(row[cBarcode]||'').trim():'';
    var pid=cBarcode>=0?pidLookup(barcode):{matched:false,source:'',type:'Unknown'};
    if(pid.type==='New')newC++;else if(pid.type==='Replenishment')replC++;else unkC++;
    var terrRRP={},terrOv={};
    if(ENG.type==='Consignment'){
      if(isMultiTerr){
        for(var mt=0;mt<terrDetected.length;mt++){var mtTerr=terrDetected[mt];var mv=numv(row[terrCols[mtTerr]]);var mcfg=TCFG[mtTerr]||{vat:1};
          terrRRP[mtTerr]=mcfg.vat===1?mv:mv/mcfg.vat;}
      }else{terrRRP[sourceTerr]=rrpEx;}}
    outRows.push({style:style,color:color,concat:concat,opt:opt,rrpEx:rrpEx,costEx:costEx,qty:qty,totalVal:totalVal,orig:row,terrRRP:terrRRP,terrOv:terrOv,
      barcode:barcode,itemType:pid.type,pidSource:pid.source});}
  var app=(hasQty&&totalQty>0)?totalValue/totalQty:null;
  var terrMethodInit={};
  for(var tt=0;tt<TERR_LIST.length;tt++){var tname=TERR_LIST[tt];if(tname===sourceTerr)continue;
    terrMethodInit[tname]=(tname==='KWT'||tname==='KSA')?{m:'multiply',v:TERR_DEFAULT_MULT[tname]}:{m:'replicate',v:0};}
  ENG.result={headers:headers,data:data,outRows:outRows,cfg:cfg,totalOpts:totalOpts,totalQty:totalQty,totalValue:totalValue,app:app,hasQty:hasQty,
    terrDetected:terrDetected,isMultiTerr:isMultiTerr,sourceTerr:sourceTerr,replicateOn:false,terrMethod:terrMethodInit,
    hasBarcode:cBarcode>=0,newC:newC,replC:replC,unkC:unkC};
  ENG.step=3;renderPage();
  toast('Processed '+outRows.length+' rows, '+totalOpts+' options'+(cBarcode>=0?' &middot; '+newC+' New, '+replC+' Replenishment':' — no barcode column found, New/Replenishment not detected'));}

/* ===== TERRITORY RRP REPLICATION (Consignment) ===== */
function computeTerrVal(sourceVal,cfgM){
  if(sourceVal==null||isNaN(sourceVal))return null;
  if(cfgM.m==='multiply')return sourceVal*(parseFloat(cfgM.v)||0);
  if(cfgM.m==='addsub')return sourceVal+(parseFloat(cfgM.v)||0);
  if(cfgM.m==='addsubpct')return sourceVal*(1+(parseFloat(cfgM.v)||0)/100);
  if(cfgM.m==='custom')return null;
  return sourceVal; /* replicate */}
function recalcTerrColumn(t){
  var R=ENG.result;var cfgM=R.terrMethod[t];if(!cfgM)return;
  for(var i=0;i<R.outRows.length;i++){var rw=R.outRows[i];
    if(rw.terrOv&&rw.terrOv[t])continue;
    if(cfgM.m==='custom')continue;
    var sv=rw.terrRRP[R.sourceTerr];rw.terrRRP[t]=computeTerrVal(sv,cfgM);}}
function recalcAllTerr(){
  var R=ENG.result;var targets=TERR_LIST.filter(function(x){return x!==R.sourceTerr;});
  for(var i=0;i<targets.length;i++)recalcTerrColumn(targets[i]);}
function onTerrMethodChange(t){
  var R=ENG.result;var mEl=$('#tm_'+t+'_method');var vEl=$('#tm_'+t+'_val');
  var m=mEl.value;var v=vEl?(parseFloat(vEl.value)||0):0;
  R.terrMethod[t]={m:m,v:v};recalcTerrColumn(t);renderPage();}
function onTerrEdit(elm){

  var v=parseFloat(elm.value);if(isNaN(v))v=null;
