/* ---------- repair / normalise ----------
   Files can be older, hand-edited, or partial. Every record is brought up to the
   shape the rest of the app expects so a missing qc block or stageIdx can never
   break a render after import. */
function normalisePO(p){
  if(!p||typeof p!=='object')return null;
  p.type=(p.type==='Consignment')?'Consignment':'Marketplace';
  var flow=FLOWS[p.type];
  var si=parseInt(p.stageIdx,10);
  if(isNaN(si)||si<0)si=0;
  if(si>flow.length-1)si=flow.length-1;
  p.stageIdx=si;
  if(!p.stage)p.stage=(si>=flow.length-1)?'Completed':flow[si];
  if(!p.approval)p.approval='Pending';
  if(!p.priority)p.priority='Medium';
  if(!p.territory)p.territory='UAE';
  if(!p.currency)p.currency=(TCFG[p.territory]||{}).cur||'AED';
  if(!p.entity)p.entity=(TCFG[p.territory]||{}).entity||'';
  if(!p.supplier)p.supplier='Unknown vendor';
  if(!p.brand)p.brand='';
  if(!p.id)p.id=uid('po');
  if(!p.poNumber)p.poNumber=p.trackingId||p.id;
  if(!p.trackingId)p.trackingId=p.poNumber;
  if(!p.createdDate)p.createdDate=new Date().toISOString().slice(0,10);
  var nums=['value','margin','totalOptions','totalQty','app'];
  for(var n=0;n<nums.length;n++)p[nums[n]]=Number(p[nums[n]])||0;
  if(!p.qc||typeof p.qc!=='object')p.qc={};
  if(!Array.isArray(p.qc.log))p.qc.log=[];
  var qs=['owner','status','approval','comments','dropReason','dropOther','delayed','delayReason','delayOther','delayNote','lastUpdated'];
  for(var q=0;q<qs.length;q++)if(p.qc[qs[q]]==null)p.qc[qs[q]]='';
  if(!Array.isArray(p.qc.delayImages))p.qc.delayImages=[];
  if(!p.itemCreation||typeof p.itemCreation!=='object')p.itemCreation={comments:[],status:''};
  if(!Array.isArray(p.itemCreation.comments))p.itemCreation.comments=[];
  if(p.itemCreation.status==null)p.itemCreation.status='';
  if(!p.extra||typeof p.extra!=='object')p.extra={};
  if(p.pidBreakdown&&typeof p.pidBreakdown==='object'){
    p.pidBreakdown.newCount=Number(p.pidBreakdown.newCount)||0;
    p.pidBreakdown.replCount=Number(p.pidBreakdown.replCount)||0;
    p.pidBreakdown.unkCount=Number(p.pidBreakdown.unkCount)||0;
  }else if(p.pidBreakdown!==null)p.pidBreakdown=null;
  return p;}

function fillGaps(d){
  for(var k in SEED){if(!(k in d))d[k]=JSON.parse(JSON.stringify(SEED[k]));}
  if(!d.masters||typeof d.masters!=='object')d.masters={};
  for(var m in SEED.masters){if(!Array.isArray(d.masters[m]))d.masters[m]=SEED.masters[m].slice();}
  if(!d.prefs||typeof d.prefs!=='object')d.prefs=JSON.parse(JSON.stringify(SEED.prefs));
  if(!d.prefs.notify||typeof d.prefs.notify!=='object')d.prefs.notify={planning:[],operations:[]};
  if(!Array.isArray(d.prefs.notify.planning))d.prefs.notify.planning=[];
  if(!Array.isArray(d.prefs.notify.operations))d.prefs.notify.operations=[];
  if(!d.prefs.authRoles)d.prefs.authRoles={};
  if(!Array.isArray(d.pos))d.pos=[];
  if(!Array.isArray(d.vendors))d.vendors=[];
  if(!Array.isArray(d.brands))d.brands=[];
  if(!Array.isArray(d.activity))d.activity=[];
  return d;}

/* ---------- parse an uploaded file ---------- */
function parseDataFile(name,text){
  var res={name:name,ok:false,error:'',db:null,counts:null,meta:null};
  var parsed;
  try{parsed=JSON.parse(text);}
  catch(e){res.error='Not valid JSON';return res;}
  var body=(parsed&&parsed.data&&typeof parsed.data==='object')?parsed.data:parsed;
  if(!body||typeof body!=='object'){res.error='Empty or unreadable';return res;}
  if(!Array.isArray(body.pos)){res.error='No "pos" list - not a PO data file';return res;}
  res.db=body;res.counts=dataCounts(body);res.ok=true;
  res.meta=(parsed&&parsed._exportedAt)?parsed._exportedAt.slice(0,16).replace('T',' '):'';
  return res;}

/* ---------- merge one file into a target ---------- */
function mergeInto(target,src,st){
  var i,j;
  /* --- POs: match on id first, then tracking id / PO number --- */
  var byId={},byTrack={};
  for(i=0;i<target.pos.length;i++){
    var tp=target.pos[i];
    if(tp.id)byId[tp.id]=i;
    if(tp.trackingId)byTrack[String(tp.trackingId).toUpperCase()]=i;
    if(tp.poNumber)byTrack[String(tp.poNumber).toUpperCase()]=i;}
  for(i=0;i<(src.pos||[]).length;i++){
    var sp=normalisePO(JSON.parse(JSON.stringify(src.pos[i])));
    if(!sp)continue;
    var at=-1;
    if(sp.id&&byId[sp.id]!==undefined)at=byId[sp.id];
    if(at<0&&sp.trackingId&&byTrack[String(sp.trackingId).toUpperCase()]!==undefined)at=byTrack[String(sp.trackingId).toUpperCase()];
    if(at<0&&sp.poNumber&&byTrack[String(sp.poNumber).toUpperCase()]!==undefined)at=byTrack[String(sp.poNumber).toUpperCase()];
    if(at>=0){target.pos[at]=sp;st.posUpdated++;}
    else{
      target.pos.push(sp);
      var ni=target.pos.length-1;
      if(sp.id)byId[sp.id]=ni;
      if(sp.trackingId)byTrack[String(sp.trackingId).toUpperCase()]=ni;
      if(sp.poNumber)byTrack[String(sp.poNumber).toUpperCase()]=ni;
      st.posAdded++;}}

  /* --- vendors: match on id, else name + territory --- */
  var vKey={};
  for(i=0;i<target.vendors.length;i++){
    var tv=target.vendors[i];
    vKey[(String(tv.name||'').toLowerCase()+'|'+(tv.territory||''))]=i;
    if(tv.id)vKey['id:'+tv.id]=i;}
  for(i=0;i<(src.vendors||[]).length;i++){
    var svd=JSON.parse(JSON.stringify(src.vendors[i]));
    if(!svd||!svd.name)continue;
    if(!svd.id)svd.id=uid('v');
    if(!svd.marketplace)svd.marketplace={enabled:false,margin:0};
    if(!svd.consignment)svd.consignment={enabled:false,margin:0};
    if(!svd.currency)svd.currency=(TCFG[svd.territory]||{}).cur||'AED';
    var vk=String(svd.name).toLowerCase()+'|'+(svd.territory||'');
    var vAt=(vKey['id:'+svd.id]!==undefined)?vKey['id:'+svd.id]:vKey[vk];
    if(vAt!==undefined){target.vendors[vAt]=svd;st.vendorsUpdated++;}
    else{target.vendors.push(svd);vKey[vk]=target.vendors.length-1;st.vendorsAdded++;}}

  /* --- brands: union, case-insensitive --- */
  var bSeen={};
  for(i=0;i<target.brands.length;i++)bSeen[String(target.brands[i]).toLowerCase()]=1;
  for(i=0;i<(src.brands||[]).length;i++){
    var b=src.brands[i];if(!b)continue;
    if(!bSeen[String(b).toLowerCase()]){target.brands.push(b);bSeen[String(b).toLowerCase()]=1;st.brandsAdded++;}}

  /* --- master lists: union each list, including any list the file adds --- */
  if(src.masters&&typeof src.masters==='object'){
    for(var mk in src.masters){
      if(!Array.isArray(src.masters[mk]))continue;
      if(!Array.isArray(target.masters[mk]))target.masters[mk]=[];
      var mSeen={};
      for(i=0;i<target.masters[mk].length;i++)mSeen[String(target.masters[mk][i]).toLowerCase()]=1;
      for(j=0;j<src.masters[mk].length;j++){
        var mv=src.masters[mk][j];if(!mv)continue;
        if(!mSeen[String(mv).toLowerCase()]){target.masters[mk].push(mv);mSeen[String(mv).toLowerCase()]=1;st.mastersAdded++;}}}}

  /* --- notification recipients: union per role, keep any access key found --- */
  if(src.prefs&&src.prefs.notify){
    var roles=['planning','operations'];
    for(var r=0;r<roles.length;r++){
      var role=roles[r];
      if(!Array.isArray(target.prefs.notify[role]))target.prefs.notify[role]=[];
      var list=src.prefs.notify[role]||[];
      for(i=0;i<list.length;i++){
        var rec=list[i];if(!rec||!rec.email)continue;
        var found=-1;
        for(j=0;j<target.prefs.notify[role].length;j++){
          if(String(target.prefs.notify[role][j].email).toLowerCase()===String(rec.email).toLowerCase()){found=j;break;}}
        if(found<0){target.prefs.notify[role].push({email:rec.email,key:rec.key||''});st.recipientsAdded++;}
        else if(rec.key&&!target.prefs.notify[role][found].key){target.prefs.notify[role][found].key=rec.key;st.recipientsAdded++;}}}}

  /* --- activity: combine, de-dup on id (or timestamp+action+detail), newest first --- */
  var aSeen={};
  for(i=0;i<target.activity.length;i++){
    var ta=target.activity[i];
    aSeen[ta.id||(ta.ts+'|'+ta.action+'|'+ta.det)]=1;}
  for(i=0;i<(src.activity||[]).length;i++){
    var sa=src.activity[i];if(!sa)continue;
    var ak=sa.id||(sa.ts+'|'+sa.action+'|'+sa.det);
    if(!aSeen[ak]){target.activity.push(sa);aSeen[ak]=1;st.activityAdded++;}}
  target.activity.sort(function(a,b){return String(b.ts||'').localeCompare(String(a.ts||''));});
  if(target.activity.length>500)target.activity.length=500;
  return st;}

/* ---------- upload flow ---------- */
var IMPORTQ=null;
function readDataFiles(fileList){
  var files=[];for(var i=0;i<fileList.length;i++)files.push(fileList[i]);
  if(!files.length)return;
  var out=[],left=files.length;
  for(var f=0;f<files.length;f++){(function(file,slot){
    var r=new FileReader();
    r.onload=function(ev){out[slot]=parseDataFile(file.name,ev.target.result);if(!--left)showImportModal(out);};
    r.onerror=function(){out[slot]={name:file.name,ok:false,error:'Could not read file'};if(!--left)showImportModal(out);};
    r.readAsText(file);})(files[f],f);}}

function showImportModal(results){
  IMPORTQ=results;
  var good=[],bad=[];
  for(var i=0;i<results.length;i++){(results[i].ok?good:bad).push(results[i]);}
  var totals={pos:0,vendors:0,brands:0,activity:0};
  for(i=0;i<good.length;i++){
    totals.pos+=good[i].counts.pos;totals.vendors+=good[i].counts.vendors;
    totals.brands+=good[i].counts.brands;totals.activity+=good[i].counts.activity;}
  var cur=dataCounts();
  var rows='';
  for(i=0;i<good.length;i++){var g=good[i];
    rows+='<tr><td style="font-weight:700;max-width:190px;overflow:hidden;text-overflow:ellipsis">'+g.name+'</td>'+
      '<td style="text-align:center">'+g.counts.pos+'</td><td style="text-align:center">'+g.counts.vendors+'</td>'+
      '<td style="text-align:center">'+g.counts.brands+'</td><td style="text-align:center">'+g.counts.activity+'</td>'+
      '<td style="color:var(--muted);font-size:11px">'+(g.meta||'&mdash;')+'</td></tr>';}
  for(i=0;i<bad.length;i++){
    rows+='<tr style="opacity:.7"><td style="font-weight:700;max-width:190px;overflow:hidden;text-overflow:ellipsis">'+bad[i].name+'</td>'+
      '<td colspan="5"><span class="tag tg-no">Skipped &mdash; '+bad[i].error+'</span></td></tr>';}

  var m=el('div','modal');m.style.maxWidth='680px';
  m.innerHTML='<div class="mh"><h3>&#11014; Upload data &mdash; review before applying</h3>'+
      '<button class="ib" id="imX">&#10005;</button></div>'+
    '<div class="mb">'+
      '<div class="ts" style="max-height:none;margin-bottom:16px"><table>'+
        '<thead><tr><th>File</th><th style="text-align:center">POs</th><th style="text-align:center">Vendors</th>'+
        '<th style="text-align:center">Brands</th><th style="text-align:center">Activity</th><th>Exported</th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div>'+
      (good.length?
      '<div class="fg">'+
        '<div class="sub" style="grid-column:1/-1;margin:0">'+
          '<h4>Choose how to apply this</h4>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
            '<div style="padding:11px;background:var(--surf);border:1px solid var(--grn);border-radius:9px">'+
              '<b style="color:var(--grn);font-size:13px">&#8853; Merge (recommended)</b>'+
              '<p style="font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55">Keeps the '+cur.pos+' PO'+(cur.pos!==1?'s':'')+' already loaded and folds these in. Matching POs are refreshed from the file; new ones are added. Brands, vendors, master lists and recipients are combined.</p></div>'+
            '<div style="padding:11px;background:var(--surf);border:1px solid var(--bdr);border-radius:9px">'+
              '<b style="font-size:13px">&#8635; Replace</b>'+
              '<p style="font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55">Discards everything currently loaded and rebuilds from these files only. Use when the file is your single source of truth.</p></div>'+
          '</div></div>'+
      '</div>':
      '<div style="padding:14px;background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.3);border-radius:9px;color:var(--red);font-size:13px">'+
        'None of the selected files could be read as PO data. Nothing has been changed.</div>')+
    '</div>'+
    '<div class="mf">'+
      '<button class="btn bg" id="imCancel">Cancel</button>'+
      (good.length?'<button class="btn bg" id="imReplace">&#8635; Replace everything</button>'+
        '<button class="btn bp" id="imMerge">&#8853; Merge '+totals.pos+' PO'+(totals.pos!==1?'s':'')+' in</button>':'')+
    '</div>';
  openM(m);
  $('#imX').onclick=closeM;$('#imCancel').onclick=closeM;
  if(good.length){
    $('#imMerge').onclick=function(){applyImport('merge');};
    $('#imReplace').onclick=function(){applyImport('replace');};}}

function applyImport(mode){
  var good=[];
  for(var i=0;i<IMPORTQ.length;i++)if(IMPORTQ[i].ok)good.push(IMPORTQ[i]);
  if(!good.length){closeM();return;}
  if(mode==='replace'){
    var n=0;for(i=0;i<good.length;i++)n+=good[i].counts.pos;
    if(dataCounts().pos&&!confirm('Replace everything currently loaded with '+n+' PO'+(n!==1?'s':'')+' from '+good.length+' file'+(good.length!==1?'s':'')+'?\n\nThis cannot be undone. Cancel and download a backup first if you need one.'))return;}

  var target=(mode==='replace')?fillGaps(JSON.parse(JSON.stringify(SEED))):fillGaps(DB);
  if(mode==='replace')target.brands=[];
  var st={posAdded:0,posUpdated:0,vendorsAdded:0,vendorsUpdated:0,brandsAdded:0,
    mastersAdded:0,recipientsAdded:0,activityAdded:0};
  for(i=0;i<good.length;i++)mergeInto(target,good[i].db,st);
  /* keep the incoming prefs that are safe to adopt, ignore role/lock state */
  var srcPrefs=good[good.length-1].db.prefs||{};
  if(srcPrefs.theme)target.prefs.theme=srcPrefs.theme;
  fillGaps(target);
  for(i=0;i<target.pos.length;i++)normalisePO(target.pos[i]);
  DB=target;
  sv();clearDirty();
  logA('Uploaded data','Data',st.posAdded+' new, '+st.posUpdated+' updated ('+mode+')');
  if(DB.prefs.theme==='dk')document.body.classList.add('dk');else document.body.classList.remove('dk');
  ENG.step=1;ENG.result=null;
  DSH={type:'',terr:'',brand:'',buyer:'',status:'',flow:'Marketplace',q:''};
  closeM();closeDataPanel();
  ST.hist=[];go(RLANDING[ST.role],{},false);
  showImportSummary(st,good.length,mode);}

function showImportSummary(st,fileCount,mode){
  var cur=dataCounts();
  var lines=[['Purchase orders added',st.posAdded],['Purchase orders refreshed',st.posUpdated],
    ['Vendors added',st.vendorsAdded],['Vendors refreshed',st.vendorsUpdated],
    ['Brands added',st.brandsAdded],['Master list values added',st.mastersAdded],
    ['Notification recipients added',st.recipientsAdded],['Activity entries added',st.activityAdded]];
  var rows='';
  for(var i=0;i<lines.length;i++){
    rows+='<div class="drow" style="padding:6px 0;border-bottom:1px solid var(--bdr)"><span>'+lines[i][0]+'</span><b>'+lines[i][1]+'</b></div>';}
  var m=el('div','modal');m.style.maxWidth='460px';
  m.innerHTML='<div class="mh"><h3>&#10003; Data loaded</h3><button class="ib" onclick="closeM()">&#10005;</button></div>'+
    '<div class="mb">'+
      '<div style="padding:11px 13px;background:rgba(46,158,107,.1);border:1px solid rgba(46,158,107,.3);border-radius:9px;color:var(--grn);font-weight:700;font-size:13px;margin-bottom:14px">'+
        (mode==='merge'?'Merged':'Rebuilt')+' from '+fileCount+' file'+(fileCount!==1?'s':'')+' &mdash; now holding '+cur.pos+' PO'+(cur.pos!==1?'s':'')+'</div>'+
      rows+
      '<p style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px">'+
        'Everything is live in the trackers and dashboard now.'+
        (STORAGE_OK?' Saved to this browser automatically.':' <b style="color:var(--acc)">Storage is blocked here, so download the data file again before you close the tab.</b>')+
        '<br>PID barcode dumps are not part of the data file &mdash; re-upload those from Masters &amp; Settings if you need the New/Replenishment check.</p>'+
    '</div>'+
    '<div class="mf"><button class="btn bp" onclick="closeM()">Done</button></div>';
  openM(m);}

/* ---------- panel ---------- */
function renderDataPanel(){
  var box=$('#DP');if(!box)return;
  var cnt=dataCounts();
  var sst=syncState();
  box.innerHTML='<h4>&#128190; Working data</h4>'+
    '<div class="dstat '+sst.cls+'">'+sst.txt+'</div>'+
    '<div class="dsum">'+
      '<div class="drow"><span>Purchase orders</span><b>'+cnt.pos+'</b></div>'+
      '<div class="drow"><span>Vendors</span><b>'+cnt.vendors+'</b></div>'+
      '<div class="drow"><span>Brands</span><b>'+cnt.brands+'</b></div>'+
      '<div class="drow"><span>Email recipients</span><b>'+cnt.recipients+'</b></div>'+
      '<div class="drow"><span>Activity entries</span><b>'+cnt.activity+'</b></div>'+
    '</div>'+
    '<div class="dbtns">'+
      '<button class="btn bp" id="dpDown">&#11015; Download data file</button>'+
      '<button class="btn bg" id="dpUp">&#11014; Upload data file(s)</button>'+
      (CLOUD_OK?'<button class="btn bg" id="dpSync">&#8635; Refresh from shared database</button>':'')+
      '<button class="btn bg" id="dpCloud">&#127760; '+(CLOUD_OK?'Manage shared database':'Connect shared database')+'</button>'+
    '</div>'+
    '<p><b style="color:var(--txt)">Start of day:</b> upload your file. '+
    '<b style="color:var(--txt)">End of day:</b> download it again to keep the changes.'+
    '<br>You can select several files at once &mdash; you will get a preview and a merge option before anything changes.'+
    (DIRTY?'<br><span style="color:var(--acc);font-weight:700">You have changes that are not in a downloaded file yet.</span>':'')+
    '</p>';
  $('#dpDown').onclick=exportData;
  $('#dpUp').onclick=function(){$('#dataFile').click();};
  var cb=$('#dpCloud');
  if(cb)cb.onclick=function(){closeDataPanel();cloudSetupModal();};
  var sb=$('#dpSync');
  if(sb)sb.onclick=function(){
    toast('Checking shared store\u2026');
    cloudPull({force:true}).then(function(r){
      if(r){renderPage();renderDataPanel();toast('Refreshed \u2014 '+DB.pos.length+' PO'+(DB.pos.length!==1?'s':''));}
      else toast('Already up to date');});};}

function openDataPanel(){renderDataPanel();$('#DP').classList.add('on');}
function closeDataPanel(){var d=$('#DP');if(d)d.classList.remove('on');}
function toggleDataPanel(){var d=$('#DP');if(d.classList.contains('on'))closeDataPanel();else openDataPanel();}

  e.target.value='';};

  var d=$('#DP');
